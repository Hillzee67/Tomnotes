<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b1d1e">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.js"></script>
<style>
  :root{
    --bg: #1b1d1e;
    --panel: #232527;
    --panel-2: #2a2d2f;
    --line: #35383a;
    --text: #d8d4c8;
    --text-dim: #8d8a80;
    --accent: #7fa86f;      /* headline / DONE green */
    --blue: #7fb3d9;        /* open / not-yet-completed todos */
    --accent-dim: #5c7a52;
    --gold: #d9b46a;        /* scheduled / today */
    --rust: #b5533c;        /* overdue */
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    --sans: 'IBM Plex Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
    height:100vh; height:100dvh;
    overscroll-behavior:none;
  }
  header.tabs{
    display:flex; gap:2px; padding:10px 10px 0 10px; background:var(--bg);
    flex-shrink:0;
  }
  header.tabs button{
    font-family:var(--mono); font-size:13px; letter-spacing:.02em;
    background:var(--panel); color:var(--text-dim); border:1px solid var(--line);
    border-bottom:none; padding:9px 14px; border-radius:6px 6px 0 0;
    cursor:pointer;
  }
  header.tabs button.active{
    background:var(--panel-2); color:var(--accent); font-weight:600;
  }
  main{
    flex:1; overflow-y:auto; background:var(--panel-2);
    border-top:1px solid var(--line);
    padding:16px 14px 90px 14px;
  }
  h1{font-family:var(--mono); font-size:15px; color:var(--text-dim); font-weight:500; margin:0 0 14px 0; letter-spacing:.02em;}
  h1 .star{color:var(--accent);}
  section.group{margin-bottom:22px;}
  section.group h2{
    font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.12em;
    margin:0 0 8px 2px; font-weight:600;
  }
  section.group.overdue h2{color:var(--rust);}
  section.group.today h2{color:var(--gold);}
  section.group.upcoming h2{color:var(--text-dim);}
  section.group.unscheduled h2{color:var(--text-dim);}
  .task{
    display:flex; align-items:flex-start; gap:10px;
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; margin-bottom:6px;
  }
  .task .box{
    flex-shrink:0; width:16px; height:16px; margin-top:2px; border-radius:3px;
    border:1.5px solid var(--accent-dim); cursor:pointer; background:transparent;
  }
  .task .box:active{background:var(--accent-dim);}
  .task .dot{
    flex-shrink:0; width:8px; height:8px; margin-top:7px;
    border-radius:50%; background:var(--gold);
  }
  .task .body{flex:1; min-width:0;}
  .task .title{font-size:14px; line-height:1.4; word-break:break-word;}
  .task .meta{font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:3px;}
  .task .meta .file{color:var(--accent-dim);}
  .task.overdue .meta{color:var(--rust);}
  .task.today .meta{color:var(--gold);}
  .empty{color:var(--text-dim); font-size:13px; font-family:var(--mono); padding:6px 2px;}
  .filelist .item{
    display:flex; justify-content:space-between; align-items:center;
    padding:11px 12px; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; margin-bottom:6px; cursor:pointer; font-family:var(--mono); font-size:13px;
  }
  .filelist .item:active{background:var(--panel-2);}
  .filelist .item .path{color:var(--text-dim); font-size:11px; margin-top:2px;}
  button.primary{
    font-family:var(--sans); font-weight:600; font-size:13px;
    background:var(--accent-dim); color:#0f1210; border:none; border-radius:7px;
    padding:10px 16px; cursor:pointer;
  }
  button.ghost{
    font-family:var(--sans); font-size:13px; background:transparent; color:var(--text-dim);
    border:1px solid var(--line); border-radius:7px; padding:9px 14px; cursor:pointer;
  }
  .row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  label{display:block; font-family:var(--mono); font-size:11px; color:var(--text-dim); margin:12px 0 5px 2px; text-transform:uppercase; letter-spacing:.08em;}
  input[type=text], input[type=password]{
    width:100%; background:var(--panel); border:1px solid var(--line); color:var(--text);
    font-family:var(--mono); font-size:13.5px; padding:10px 11px; border-radius:7px;
  }
  textarea{
    width:100%; min-height:52vh; background:var(--panel); border:1px solid var(--line);
    color:var(--text); font-family:var(--mono); font-size:13px; line-height:1.55;
    padding:12px; border-radius:8px; resize:vertical;
  }
  .editor-topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px;}
  .editor-topbar .name{font-family:var(--mono); font-size:12.5px; color:var(--text-dim); word-break:break-all;}
  .CodeMirror{
    height:52vh; min-height:320px;
    background:var(--panel); color:var(--text);
    font-family:var(--mono); font-size:13px; line-height:1.55;
    border:1px solid var(--line); border-radius:8px;
  }
  .CodeMirror-gutters{background:var(--panel); border-right:1px solid var(--line);}
  .CodeMirror-foldgutter{width:16px;}
  .CodeMirror-foldgutter-open:after{content:"▾"; color:var(--text-dim); cursor:pointer; padding-left:2px;}
  .CodeMirror-foldgutter-folded:after{content:"▸"; color:var(--accent); cursor:pointer; padding-left:2px;}
  .CodeMirror-cursor{border-left:1.5px solid var(--accent);}
  .CodeMirror-selected{background:rgba(127,168,111,.25) !important;}
  .CodeMirror pre.CodeMirror-line, .CodeMirror pre.CodeMirror-line-like{color:var(--text);}
  .cm-todo-open{color:var(--blue); font-weight:600;}
  .cm-todo-done{color:var(--accent); font-weight:600;}
  .cm-searching{background:rgba(217,180,106,.25);}
  .outline-node{}
  .outline-row{
    display:flex; align-items:center; gap:7px; padding:7px 6px; border-radius:6px; cursor:pointer;
  }
  .outline-row:active{background:var(--panel);}
  .caret{
    flex-shrink:0; width:18px; height:18px; background:transparent; border:none; color:var(--text-dim);
    font-size:11px; cursor:pointer; padding:0;
  }
  .caret-empty{width:18px; display:inline-block;}
  .outline-title{font-size:13.5px; flex:1; min-width:0; overflow-wrap:anywhere;}
  .outline-title.todo-open{color:var(--blue);}
  .outline-date{font-family:var(--mono); font-size:10.5px; color:var(--text-dim); flex-shrink:0;}
  .badge{
    font-family:var(--mono); font-size:9.5px; font-weight:600; letter-spacing:.04em;
    padding:2px 5px; border-radius:4px; flex-shrink:0;
  }
  .badge-TODO{background:rgba(217,180,106,.15); color:var(--gold);}
  .badge-NEXT{background:rgba(217,180,106,.15); color:var(--gold);}
  .badge-WAITING{background:rgba(181,83,60,.15); color:var(--rust);}
  .badge-DONE{background:rgba(127,168,111,.15); color:var(--accent);}
  .badge-CANCELLED{background:rgba(141,138,128,.15); color:var(--text-dim);}
  .outline-children{border-left:1px solid var(--line); margin-left:9px;}
  footer.modeline{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    font-family:var(--mono); font-size:11px; color:var(--text-dim);
    background:var(--panel); border-top:1px solid var(--line);
    padding:8px 12px calc(8px + env(safe-area-inset-bottom)) 12px;
    display:flex; justify-content:space-between; gap:10px;
  }
  footer.modeline .status.ok{color:var(--accent);}
  footer.modeline .status.err{color:var(--rust);}
  footer.modeline .status.busy{color:var(--gold);}
  a{color:var(--accent);}
  ::selection{background:var(--accent-dim); color:#0f1210;}
</style>
</head>
<body>

<header class="tabs" id="tabs">
  <button data-tab="agenda" class="active">agenda</button>
  <button data-tab="files">files</button>
  <button data-tab="settings">settings</button>
</header>

<main id="main"></main>

<footer class="modeline">
  <span id="ml-buffer">*agenda*</span>
  <span id="ml-status" class="status">not configured</span>
</footer>

<script>
/* ---------- storage ---------- */
const store = {
  get(k, d=null){ try{ const v = localStorage.getItem(k); return v===null? d : JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

let settings = store.get('gh_settings', {token:'', owner:'', repo:'', branch:'main', notesPath:'notes'});
let fileCache = {};   // path -> {content, sha}
let tasksCache = [];  // parsed tasks from last agenda refresh
let currentTab = 'agenda';

/* ---------- github api ---------- */
function ghHeaders(){
  return {
    'Authorization': 'token ' + settings.token,
    'Accept': 'application/vnd.github+json'
  };
}
function apiBase(){
  return `https://api.github.com/repos/${settings.owner}/${settings.repo}`;
}
async function ghGetDir(path){
  const url = `${apiBase()}/contents/${path}?ref=${encodeURIComponent(settings.branch)}`;
  const res = await fetch(url, {headers: ghHeaders()});
  if (res.status === 404) return [];
  if (!res.ok) throw new Error(`GitHub error ${res.status}: ${(await res.json()).message || res.statusText}`);
  return res.json();
}
async function ghGetFile(path){
  const url = `${apiBase()}/contents/${path}?ref=${encodeURIComponent(settings.branch)}`;
  const res = await fetch(url, {headers: ghHeaders()});
  if (!res.ok) throw new Error(`GitHub error ${res.status}: ${(await res.json()).message || res.statusText}`);
  const data = await res.json();
  const content = decodeURIComponent(escape(atob(data.content.replace(/\n/g,''))));
  return {content, sha: data.sha};
}
async function ghPutFile(path, content, sha, message){
  const url = `${apiBase()}/contents/${path}`;
  const body = {
    message: message || `Update ${path}`,
    content: btoa(unescape(encodeURIComponent(content))),
    branch: settings.branch
  };
  if (sha) body.sha = sha;
  const res = await fetch(url, {method:'PUT', headers:{...ghHeaders(),'Content-Type':'application/json'}, body: JSON.stringify(body)});
  if (!res.ok) throw new Error(`GitHub error ${res.status}: ${(await res.json()).message || res.statusText}`);
  return res.json();
}
async function listOrgFiles(path){
  let out = [];
  let entries;
  try{ entries = await ghGetDir(path); } catch(e){ throw e; }
  if (!Array.isArray(entries)) return out;
  for (const e of entries){
    if (e.type === 'dir') out = out.concat(await listOrgFiles(e.path));
    else if (e.type === 'file' && e.path.endsWith('.org')) out.push(e.path);
  }
  return out;
}

/* ---------- org parsing ---------- */
const HEADLINE_RE = /^(\*+)\s+(TODO|NEXT|WAITING|DONE|CANCELLED)?\s*(?:\[#([A-C])\]\s*)?(.*)$/;
const DATE_RE = /(SCHEDULED|DEADLINE):\s*<(\d{4}-\d{2}-\d{2})[^>]*>/g;
const PLAIN_TIMESTAMP_RE = /<(\d{4}-\d{2}-\d{2}) \w{3}(?: (\d{2}:\d{2}))?>/;

function parseOrgFile(path, text){
  const lines = text.split('\n');
  const tasks = [];
  for (let i=0; i<lines.length; i++){
    const m = lines[i].match(HEADLINE_RE);
    if (!m) continue;
    const state = m[2] || null;
    const priority = m[3] || null;
    const title = m[4].trim();
    const nextLine = lines[i+1] || '';

    if (state){
      // A task: TODO/NEXT/WAITING/DONE/CANCELLED, dated via SCHEDULED/DEADLINE.
      let scheduled = null, deadline = null;
      let dm;
      DATE_RE.lastIndex = 0;
      while ((dm = DATE_RE.exec(nextLine)) !== null){
        if (dm[1] === 'SCHEDULED') scheduled = dm[2];
        if (dm[1] === 'DEADLINE') deadline = dm[2];
      }
      tasks.push({file: path, lineIndex: i, type: 'task', state, priority, title, scheduled, deadline});
    } else {
      // No keyword — treat a headline with a plain timestamp underneath it
      // as an event/appointment rather than a task.
      const tm = nextLine.match(PLAIN_TIMESTAMP_RE);
      if (tm && title){
        tasks.push({file: path, lineIndex: i, type: 'event', title, scheduled: tm[1], deadline: null, time: tm[2] || null});
      }
    }
  }
  return tasks;
}

function todayStr(){
  return localDateStr(new Date());
}

function localDateStr(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function dayLabel(d, offset){
  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dateStr = `${dayNames[d.getDay()]} ${d.getDate()} ${monthNames[d.getMonth()]}`;
  if (offset === 0) return `Today · ${dateStr}`;
  if (offset === 1) return `Tomorrow · ${dateStr}`;
  return dateStr;
}

/* ---------- agenda ---------- */
async function refreshAgenda(){
  setStatus('busy', 'syncing…');
  try{
    const files = await listOrgFiles(settings.notesPath);
    const all = [];
    for (const path of files){
      const {content, sha} = await ghGetFile(path);
      fileCache[path] = {content, sha};
      all.push(...parseOrgFile(path, content));
    }
    tasksCache = all;
    setStatus('ok', `synced ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`);
  }catch(e){
    setStatus('err', e.message);
  }
  renderAgenda();
}

function renderAgenda(){
  const today = todayStr();
  const open = tasksCache.filter(t => t.state !== 'DONE' && t.state !== 'CANCELLED');
  const overdue = open.filter(t => {
    const d = t.deadline || t.scheduled;
    return d && d < today;
  });
  const unscheduled = open.filter(t => !t.scheduled && !t.deadline);

  const main = document.getElementById('main');
  if (!settings.token || !settings.owner || !settings.repo){
    main.innerHTML = `<h1><span class="star">*</span> agenda</h1><div class="empty">Not connected yet — head to the Settings tab and add your repo details.</div>`;
    return;
  }

  let days = '';
  const base = new Date();
  base.setHours(0,0,0,0);
  for (let i = 0; i <= 7; i++){
    const d = new Date(base);
    d.setDate(base.getDate() + i);
    const key = localDateStr(d);
    const dayTasks = open.filter(t => t.scheduled === key || t.deadline === key)
      .sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
    days += dayGroup(i === 0 ? 'today' : 'upcoming', dayLabel(d, i), dayTasks);
  }

  main.innerHTML = `<h1><span class="star">*</span> agenda</h1>` +
    group('overdue', 'Overdue', overdue) +
    days +
    group('unscheduled', 'Unscheduled', unscheduled) +
    `<div class="row" style="margin-top:16px;">
       <button class="ghost" onclick="refreshAgenda()">↻ refresh</button>
     </div>`;
}

function taskRow(t, cls){
  const dateLabel = t.deadline ? `deadline ${t.deadline}` : (t.scheduled ? `scheduled ${t.scheduled}` : '');
  const idx = tasksCache.indexOf(t);
  if (t.type === 'event'){
    const timeLabel = t.time ? `${t.time} · ` : '';
    return `<div class="task ${cls} event">
      <span class="dot" aria-hidden="true"></span>
      <div class="body">
        <div class="title">${escapeHtml(t.title)}</div>
        <div class="meta">${timeLabel}<span class="file">${escapeHtml(t.file.split('/').pop())}</span></div>
      </div>
    </div>`;
  }
  return `<div class="task ${cls}">
    <button class="box" onclick="toggleTask(${idx})" aria-label="mark done"></button>
    <div class="body">
      <div class="title">${escapeHtml(t.title)}</div>
      <div class="meta"><span class="file">${escapeHtml(t.file.split('/').pop())}</span>${dateLabel ? ' · ' + dateLabel : ''}</div>
    </div>
  </div>`;
}

function group(cls, label, items){
  if (!items.length) return '';
  return `<section class="group ${cls}"><h2>${label}</h2>${items.map(t => taskRow(t, cls)).join('')}</section>`;
}

function dayGroup(cls, label, items){
  const rows = items.length
    ? items.map(t => taskRow(t, cls)).join('')
    : `<div class="empty" style="padding:4px 2px;">nothing scheduled</div>`;
  return `<section class="group ${cls}"><h2>${label}</h2>${rows}</section>`;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function toggleTask(idx){
  const t = tasksCache[idx];
  if (!t) return;
  const cached = fileCache[t.file];
  if (!cached) return;
  const lines = cached.content.split('\n');
  lines[t.lineIndex] = lines[t.lineIndex].replace(/^(\*+\s+)(TODO|NEXT|WAITING)\b/, '$1DONE');
  const newContent = lines.join('\n');
  setStatus('busy', 'saving…');
  try{
    const res = await ghPutFile(t.file, newContent, cached.sha, `Mark done: ${t.title}`);
    fileCache[t.file] = {content: newContent, sha: res.content.sha};
    t.state = 'DONE';
    setStatus('ok', 'saved');
    renderAgenda();
  }catch(e){
    setStatus('err', e.message);
  }
}

/* ---------- files tab ---------- */
async function renderFiles(){
  const main = document.getElementById('main');
  if (!settings.token || !settings.owner || !settings.repo){
    main.innerHTML = `<h1><span class="star">*</span> files</h1><div class="empty">Not connected yet — head to the Settings tab and add your repo details.</div>`;
    return;
  }
  main.innerHTML = `<h1><span class="star">*</span> files</h1><div class="row"><button class="primary" onclick="createFile()">+ new file</button><button class="ghost" onclick="renderFiles()">↻ refresh</button></div><div class="filelist" id="filelist"><div class="empty">loading…</div></div>`;
  try{
    const files = await listOrgFiles(settings.notesPath);
    const list = document.getElementById('filelist');
    if (!files.length){ list.innerHTML = `<div class="empty">No .org files in "${settings.notesPath}" yet.</div>`; return; }
    list.innerHTML = files.map(f => `<div class="item" onclick="openFile('${f.replace(/'/g,"\\'")}')"><div><div>${escapeHtml(f.split('/').pop())}</div><div class="path">${escapeHtml(f)}</div></div><span>›</span></div>`).join('');
  }catch(e){
    document.getElementById('filelist').innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
  }
}

async function createFile(){
  const name = prompt('New file name (e.g. projects.org):');
  if (!name) return;
  const path = settings.notesPath + '/' + name.replace(/^\/+/, '');
  const template = `*** TODO \n`; // ctrl+alt+t to cycle TODO/DONE, ctrl+alt+s to insert SCHEDULED once you're editing
  setStatus('busy', 'creating…');
  try{
    await ghPutFile(path, template, null, `Create ${path}`);
    setStatus('ok', 'created');
    openFile(path);
  }catch(e){
    setStatus('err', e.message);
  }
}

let editorView = 'outline';       // 'outline' | 'raw'
let outlineCollapsed = new Set(store.get('outline_collapsed', [])); // keys like "path::level::title", persisted
let hideDoneItems = false;
let cmInstance = null;
let suppressAutoFix = false;

async function openFile(path){
  const main = document.getElementById('main');
  main.innerHTML = `<div class="editor-topbar"><span class="name">${escapeHtml(path)}</span><button class="ghost" onclick="renderFiles()">‹ back</button></div><div class="empty">loading…</div>`;
  document.getElementById('ml-buffer').textContent = path.split('/').pop();
  editorView = 'outline';
  cmInstance = null;
  try{
    const {content, sha} = await ghGetFile(path);
    fileCache[path] = {content, sha};
    renderEditorPane(path);
  }catch(e){
    main.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
  }
}

function renderEditorPane(path){
  const main = document.getElementById('main');
  const content = fileCache[path].content;
  const toggle = `
    <div class="row" style="margin:0 0 10px 0;">
      <button class="${editorView==='outline'?'primary':'ghost'}" onclick="switchEditorView('${path.replace(/'/g,"\\'")}','outline')">outline</button>
      <button class="${editorView==='raw'?'primary':'ghost'}" onclick="switchEditorView('${path.replace(/'/g,"\\'")}','raw')">raw</button>
      ${editorView==='outline' ? `<button class="ghost" onclick="toggleHideDone('${path.replace(/'/g,"\\'")}')">${hideDoneItems ? 'show done' : 'hide done'}</button>` : ''}
    </div>`;
  if (editorView === 'outline'){
    let tree = buildOutlineTree(content);
    if (hideDoneItems) tree = filterDoneNodes(tree);
    const body = tree.length
      ? renderOutlineNodes(tree, path)
      : `<div class="empty">${hideDoneItems ? 'Nothing left to show — everything here is done.' : 'No headlines yet — switch to raw and add one, e.g. "* TODO something".'}</div>`;
    main.innerHTML = `<div class="editor-topbar"><span class="name">${escapeHtml(path)}</span><button class="ghost" onclick="renderFiles()">‹ back</button></div>${toggle}<div class="outline">${body}</div>`;
  } else {
    main.innerHTML = `<div class="editor-topbar"><span class="name">${escapeHtml(path)}</span><button class="primary" onclick="saveFile('${path.replace(/'/g,"\\'")}')">save</button></div>${toggle}
      <div class="row" style="margin-bottom:8px;">
        <div class="empty" style="padding:0;">${SHORTCUT_HINT}</div>
        <button class="ghost" onclick="openDatePicker()">📅 pick date</button>
      </div>
      <div id="editor-cm"></div>`;
    initRawEditor(content, path);
  }
}

// Minimal highlighting mode: colors the TODO-state keyword at the start of
// a headline, leaving everything else as plain text.
CodeMirror.defineMode('org-highlight', function(){
  return {
    startState: function(){ return {headlineMatch: null}; },
    token: function(stream, state){
      if (stream.sol()){
        state.headlineMatch = stream.string.match(/^(\*+\s+)(TODO|NEXT|WAITING|DONE|CANCELLED)?/);
      }
      const m = state.headlineMatch;
      const pos = stream.pos;
      if (m && pos < m[1].length){
        stream.pos = m[1].length;
        return null;
      }
      if (m && m[2] && pos === m[1].length){
        stream.pos = m[1].length + m[2].length;
        return (m[2] === 'DONE' || m[2] === 'CANCELLED') ? 'todo-done' : 'todo-open';
      }
      stream.skipToEnd();
      return null;
    }
  };
});

function initRawEditor(content, path){
  cmInstance = CodeMirror(document.getElementById('editor-cm'), {
    value: content,
    mode: 'org-highlight',
    lineNumbers: false,
    lineWrapping: true,
    gutters: ['CodeMirror-foldgutter'],
    foldGutter: {rangeFinder: orgRangeFinder}
  });
  cmInstance.setOption('extraKeys', {
    'Ctrl-Alt-T': cm => toggleTodoAtCursor(cm),
    'Ctrl-Alt-S': cm => insertScheduledAtCursor(cm),
    'Ctrl-Alt-E': cm => insertEventAtCursor(cm)
  });
  cmInstance.on('changes', () => {
    if (suppressAutoFix) return;
    suppressAutoFix = true;
    try{
      fixTimestampWeekdaysInEditor(cmInstance);
      applyPersistedFolds(cmInstance, path);
    }catch(e){
      console.error('editor auto-fix error:', e);
    }finally{
      suppressAutoFix = false;
    }
  });
  cmInstance.on('fold', (cm, from) => recordFoldChange(cm, path, from.line, true));
  cmInstance.on('unfold', (cm, from) => recordFoldChange(cm, path, from.line, false));
  if (window._jumpToLine !== undefined){
    const line = window._jumpToLine;
    cmInstance.setCursor({line, ch: 0});
    cmInstance.scrollIntoView({line, ch: 0}, 100);
    window._jumpToLine = undefined;
  }
  setTimeout(() => {
    if (!cmInstance) return;
    cmInstance.refresh();
    applyPersistedFolds(cmInstance, path);
  }, 30);
}

// Identify a headline by level+title (same convention Outline view uses)
// rather than by line number, so it stays matched even as the file above
// it changes length.
function headlineKeyAtLine(cm, path, lineIndex){
  const line = cm.getLine(lineIndex);
  const m = line.match(/^(\*+)\s+(?:TODO|NEXT|WAITING|DONE|CANCELLED)?\s?(.*)$/);
  if (!m) return null;
  return path + '::' + m[1].length + '::' + m[2].trim();
}

// Re-fold anything that's supposed to be folded per the persisted set. This
// is what actually makes folds durable: rather than trusting CodeMirror's
// internal fold markers to survive edits, we treat the persisted set as the
// source of truth and re-apply it after every change.
function applyPersistedFolds(cm, path){
  const lineCount = cm.lineCount();
  for (let i = 0; i < lineCount; i++){
    const key = headlineKeyAtLine(cm, path, i);
    if (key && outlineCollapsed.has(key)){
      cm.foldCode(CodeMirror.Pos(i, 0), {rangeFinder: orgRangeFinder}, 'fold');
    }
  }
}

function recordFoldChange(cm, path, lineIndex, isFolded){
  const key = headlineKeyAtLine(cm, path, lineIndex);
  if (!key) return;
  if (isFolded) outlineCollapsed.add(key);
  else outlineCollapsed.delete(key);
  store.set('outline_collapsed', Array.from(outlineCollapsed));
}

// Org-style subtree folding: fold everything below a headline down to (but
// not including) the next headline at the same or a shallower level.
function orgRangeFinder(cm, start){
  const startLine = start.line;
  const lineText = cm.getLine(startLine);
  const m = lineText.match(/^(\*+)\s/);
  if (!m) return null;
  const level = m[1].length;
  const lastLine = cm.lastLine();
  let endLine = startLine;
  for (let i = startLine + 1; i <= lastLine; i++){
    const t = cm.getLine(i);
    const mm = t.match(/^(\*+)\s/);
    if (mm && mm[1].length <= level) break;
    endLine = i;
  }
  if (endLine === startLine) return null;
  return {
    from: CodeMirror.Pos(startLine, lineText.length),
    to: CodeMirror.Pos(endLine, cm.getLine(endLine).length)
  };
}

function switchEditorView(path, view){
  editorView = view;
  renderEditorPane(path);
}

function toggleHideDone(path){
  hideDoneItems = !hideDoneItems;
  renderEditorPane(path);
}

function filterDoneNodes(nodes){
  return nodes
    .filter(n => n.state !== 'DONE' && n.state !== 'CANCELLED')
    .map(n => ({...n, children: filterDoneNodes(n.children)}));
}

/* ---------- outline tree ---------- */
function buildOutlineTree(content){
  const lines = content.split('\n');
  const root = {level: 0, children: []};
  const stack = [root];
  for (let i=0; i<lines.length; i++){
    const m = lines[i].match(HEADLINE_RE);
    if (!m) continue;
    const level = m[1].length;
    const state = m[2] || null;
    const title = (m[4] || '').trim();
    let scheduled = null, deadline = null;
    if (lines[i+1]){
      let dm; DATE_RE.lastIndex = 0;
      while ((dm = DATE_RE.exec(lines[i+1])) !== null){
        if (dm[1] === 'SCHEDULED') scheduled = dm[2];
        if (dm[1] === 'DEADLINE') deadline = dm[2];
      }
      if (!scheduled && !deadline && !state){
        const tm = lines[i+1].match(PLAIN_TIMESTAMP_RE);
        if (tm) scheduled = tm[1];
      }
    }
    const node = {level, state, title, scheduled, deadline, lineIndex: i, children: []};
    while (stack.length && stack[stack.length-1].level >= level) stack.pop();
    stack[stack.length-1].children.push(node);
    stack.push(node);
  }
  return root.children;
}

function renderOutlineNodes(nodes, path){
  return nodes.map(n => {
    const key = path + '::' + n.level + '::' + n.title;
    const collapsed = outlineCollapsed.has(key);
    const hasChildren = n.children.length > 0;
    const caret = hasChildren
      ? `<button class="caret" onclick="event.stopPropagation();toggleOutlineNode('${key.replace(/'/g,"\\'")}','${path.replace(/'/g,"\\'")}')">${collapsed ? '▸' : '▾'}</button>`
      : `<span class="caret caret-empty"></span>`;
    const stateBadge = n.state ? `<span class="badge badge-${n.state}">${n.state}</span>` : '';
    const isOpen = n.state === 'TODO' || n.state === 'NEXT' || n.state === 'WAITING';
    const titleClass = isOpen ? 'outline-title todo-open' : 'outline-title';
    const dateLabel = n.deadline ? `deadline ${n.deadline}` : (n.scheduled ? `scheduled ${n.scheduled}` : '');
    const indent = (n.level - 1) * 18;
    const childrenHtml = hasChildren && !collapsed ? `<div class="outline-children">${renderOutlineNodes(n.children, path)}</div>` : '';
    return `<div class="outline-node" style="margin-left:${indent}px;">
      <div class="outline-row" onclick="jumpToLine('${path.replace(/'/g,"\\'")}', ${n.lineIndex})">
        ${caret}
        ${stateBadge}
        <span class="${titleClass}">${escapeHtml(n.title) || '<span class=\"empty\" style=\"display:inline\">(untitled)</span>'}</span>
        ${dateLabel ? `<span class="outline-date">${dateLabel}</span>` : ''}
      </div>
      ${childrenHtml}
    </div>`;
  }).join('');
}

function toggleOutlineNode(key, path){
  if (outlineCollapsed.has(key)) outlineCollapsed.delete(key);
  else outlineCollapsed.add(key);
  store.set('outline_collapsed', Array.from(outlineCollapsed));
  renderEditorPane(path);
}

function jumpToLine(path, lineIndex){
  window._jumpToLine = lineIndex;
  editorView = 'raw';
  renderEditorPane(path);
}

/* ---------- editor keyboard shortcuts (operate on the CodeMirror instance) ---------- */
function toggleTodoAtCursor(cm){
  const pos = cm.getCursor();
  const line = cm.getLine(pos.line);
  const m = line.match(/^(\*+\s+)(TODO|DONE)?\s?(.*)$/);
  let newLine;
  if (!m){
    newLine = '*** TODO ' + line;
  } else {
    const stars = m[1], kw = m[2], rest = m[3];
    const next = !kw ? 'TODO ' : (kw === 'TODO' ? 'DONE ' : '');
    newLine = stars + next + rest;
  }
  cm.replaceRange(newLine, {line: pos.line, ch: 0}, {line: pos.line, ch: line.length});
}

function insertScheduledAtCursor(cm, date){
  const pos = cm.getCursor();
  const lineLen = cm.getLine(pos.line).length;
  const d = date || new Date();
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const iso = localDateStr(d); // local date, not UTC — see todayStr() note above
  const insertion = `\nSCHEDULED: <${iso} ${days[d.getDay()]}>`;
  cm.replaceRange(insertion, {line: pos.line, ch: lineLen});
}

function insertEventAtCursor(cm, date){
  const pos = cm.getCursor();
  const line = cm.getLine(pos.line);
  if (!/^\*+\s/.test(line)){
    // Not a headline yet — turn this line into one first, level 3 by default.
    cm.replaceRange('*** ' + line, {line: pos.line, ch: 0}, {line: pos.line, ch: line.length});
  }
  const lineLen = cm.getLine(pos.line).length; // re-read: line may have just changed above
  const d = date || new Date();
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const iso = localDateStr(d);
  const insertion = `\n<${iso} ${days[d.getDay()]}>`;
  cm.replaceRange(insertion, {line: pos.line, ch: lineLen});
}

function openDatePicker(){
  if (!cmInstance) return;
  const input = document.createElement('input');
  input.type = 'date';
  input.style.position = 'fixed';
  input.style.opacity = '0';
  input.style.pointerEvents = 'none';
  input.style.left = '50%';
  input.style.top = '0';
  document.body.appendChild(input);
  const cleanup = () => { if (input.parentNode) document.body.removeChild(input); };
  input.addEventListener('change', () => {
    if (input.value){
      const [y, m, d] = input.value.split('-').map(Number);
      insertScheduledAtCursor(cmInstance, new Date(y, m - 1, d));
      cmInstance.focus();
    }
    cleanup();
  });
  input.addEventListener('blur', () => setTimeout(cleanup, 200));
  if (input.showPicker) input.showPicker();
  else input.click();
}

// If the date digits in a SCHEDULED/DEADLINE timestamp are edited by hand,
// keep the weekday abbreviation next to them in sync automatically. This
// edits only the mismatched 3-letter span in place (via replaceRange)
// rather than replacing the whole document, so it never disturbs fold
// markers elsewhere in the file.
function fixTimestampWeekdaysInEditor(cm){
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const lineCount = cm.lineCount();
  for (let i = 0; i < lineCount; i++){
    const line = cm.getLine(i);
    const re = /<(\d{4})-(\d{2})-(\d{2}) (\w{3})/g;
    let m;
    while ((m = re.exec(line)) !== null){
      const [full, y, mo, d, dow] = m;
      const dt = new Date(Number(y), Number(mo) - 1, Number(d));
      if (isNaN(dt.getTime())) continue;
      const correct = days[dt.getDay()];
      if (correct !== dow){
        const dowStart = m.index + full.length - dow.length;
        cm.replaceRange(correct, CodeMirror.Pos(i, dowStart), CodeMirror.Pos(i, dowStart + dow.length));
      }
    }
  }
}

const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const SHORTCUT_HINT = IS_MAC
  ? '⌃⌥T toggle todo · ⌃⌥S scheduled · ⌃⌥E event · tap ▸ to fold'
  : 'ctrl+alt+t toggle todo · ctrl+alt+s scheduled · ctrl+alt+e event · tap ▸ to fold';

async function saveFile(path){
  const content = cmInstance ? cmInstance.getValue() : (fileCache[path] ? fileCache[path].content : '');
  const cached = fileCache[path];
  setStatus('busy', 'saving…');
  try{
    const res = await ghPutFile(path, content, cached ? cached.sha : null, `Edit ${path}`);
    fileCache[path] = {content, sha: res.content.sha};
    setStatus('ok', 'saved');
  }catch(e){
    setStatus('err', e.message);
  }
}

/* ---------- settings tab ---------- */
function renderSettings(){
  document.getElementById('ml-buffer').textContent = '*settings*';
  const main = document.getElementById('main');
  main.innerHTML = `
    <h1><span class="star">*</span> settings</h1>
    <label>GitHub token (repo scope)</label>
    <input type="password" id="s-token" value="${settings.token}" placeholder="ghp_...">
    <label>Owner</label>
    <input type="text" id="s-owner" value="${settings.owner}" placeholder="your-username">
    <label>Repository</label>
    <input type="text" id="s-repo" value="${settings.repo}" placeholder="notes">
    <label>Branch</label>
    <input type="text" id="s-branch" value="${settings.branch}" placeholder="main">
    <label>Notes folder</label>
    <input type="text" id="s-path" value="${settings.notesPath}" placeholder="notes">
    <div class="row" style="margin-top:16px;">
      <button class="primary" onclick="saveSettings()">save & connect</button>
    </div>
    <div class="empty" style="margin-top:18px; line-height:1.6;">
      Create a fine-grained personal access token scoped only to this repo, with read/write access to "Contents". Nothing is sent anywhere except directly to api.github.com from this page.
    </div>
  `;
}

function saveSettings(){
  settings = {
    token: document.getElementById('s-token').value.trim(),
    owner: document.getElementById('s-owner').value.trim(),
    repo: document.getElementById('s-repo').value.trim(),
    branch: document.getElementById('s-branch').value.trim() || 'main',
    notesPath: document.getElementById('s-path').value.trim().replace(/\/+$/,'') || 'notes'
  };
  store.set('gh_settings', settings);
  switchTab('agenda');
  refreshAgenda();
}

/* ---------- tabs / status ---------- */
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if (tab === 'agenda'){ document.getElementById('ml-buffer').textContent = '*agenda*'; renderAgenda(); }
  else if (tab === 'files'){ document.getElementById('ml-buffer').textContent = '*files*'; renderFiles(); }
  else if (tab === 'settings'){ renderSettings(); }
}
document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('button[data-tab]');
  if (btn) switchTab(btn.dataset.tab);
});

function setStatus(kind, msg){
  const el = document.getElementById('ml-status');
  el.className = 'status ' + kind;
  el.textContent = msg;
}

/* ---------- boot ---------- */
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
if (settings.token && settings.owner && settings.repo){
  refreshAgenda();
} else {
  setStatus('err', 'not configured');
  renderAgenda();
}
</script>
