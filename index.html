<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b1d1e">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.js"></script>
<style>
  :root{
    --bg: #1b1d1e;
    --panel: #232527;
    --panel-2: #2a2d2f;
    --line: #35383a;
    --text: #d8d4c8;
    --text-dim: #8d8a80;
    --accent: #7fa86f;      /* headline / DONE green */
    --blue: #7fb3d9;        /* open / not-yet-completed todos */
    --teal: #7fb8b3;        /* headline level 2 */
    --lavender: #b39ddb;    /* headline level 3 */
    --accent-dim: #5c7a52;
    --gold: #d9b46a;        /* scheduled / today */
    --rust: #b5533c;        /* overdue */
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    --sans: 'IBM Plex Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
    height:100vh; height:100dvh;
    overscroll-behavior:none;
  }
  header.tabs{
    display:flex; gap:2px; padding:10px 10px 0 10px; background:var(--bg);
    flex-shrink:0;
  }
  header.tabs button{
    font-family:var(--mono); font-size:13px; letter-spacing:.02em;
    background:var(--panel); color:var(--text-dim); border:1px solid var(--line);
    border-bottom:none; padding:9px 14px; border-radius:6px 6px 0 0;
    cursor:pointer;
  }
  header.tabs button.active{
    background:var(--panel-2); color:var(--accent); font-weight:600;
  }
  main{
    flex:1; overflow-y:auto; background:var(--panel-2);
    border-top:1px solid var(--line);
    padding:16px 14px 90px 14px;
  }
  h1{font-family:var(--mono); font-size:15px; color:var(--text-dim); font-weight:500; margin:0 0 14px 0; letter-spacing:.02em;}
  h1 .star{color:var(--accent);}
  section.group{margin-bottom:22px;}
  section.group h2{
    font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.12em;
    margin:0 0 8px 2px; font-weight:600;
  }
  section.group.overdue h2{color:var(--rust);}
  section.group.today h2{color:var(--gold);}
  section.group.upcoming h2{color:var(--text-dim);}
  section.group.unscheduled h2{color:var(--text-dim);}
  .task{
    display:flex; align-items:flex-start; gap:10px;
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; margin-bottom:6px;
  }
  .task .box{
    flex-shrink:0; width:16px; height:16px; margin-top:2px; border-radius:3px;
    border:1.5px solid var(--accent-dim); cursor:pointer; background:transparent;
  }
  .task .box:active{background:var(--accent-dim);}
  .task .dot{
    flex-shrink:0; width:8px; height:8px; margin-top:7px;
    border-radius:50%; background:var(--gold);
  }
  .task .body{flex:1; min-width:0;}
  .task .title{font-size:14px; line-height:1.4; word-break:break-word;}
  .task .meta{font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:3px;}
  .task .drag-handle{
    flex-shrink:0; align-self:center; background:transparent; border:none;
    color:var(--text-dim); font-size:16px; line-height:1; padding:6px 4px;
    cursor:grab; touch-action:none; -webkit-user-select:none; user-select:none;
  }
  .task.dragging{
    border-color:var(--accent); box-shadow:0 2px 10px rgba(0,0,0,.4); opacity:.9;
  }
  .task .meta .file{color:var(--accent-dim);}
  .task.overdue .meta{color:var(--rust);}
  .task.today .meta{color:var(--gold);}
  .empty{color:var(--text-dim); font-size:13px; font-family:var(--mono); padding:6px 2px;}
  .filelist .item{
    display:flex; justify-content:space-between; align-items:center;
    padding:11px 12px; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; margin-bottom:6px; cursor:pointer; font-family:var(--mono); font-size:13px;
  }
  .filelist .item:active{background:var(--panel-2);}
  .filelist .item .path{color:var(--text-dim); font-size:11px; margin-top:2px;}
  button.primary{
    font-family:var(--sans); font-weight:600; font-size:13px;
    background:var(--accent-dim); color:#0f1210; border:none; border-radius:7px;
    padding:10px 16px; cursor:pointer;
  }
  button.ghost{
    font-family:var(--sans); font-size:13px; background:transparent; color:var(--text-dim);
    border:1px solid var(--line); border-radius:7px; padding:9px 14px; cursor:pointer;
  }
  .row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  label{display:block; font-family:var(--mono); font-size:11px; color:var(--text-dim); margin:12px 0 5px 2px; text-transform:uppercase; letter-spacing:.08em;}
  input[type=text], input[type=password], input[type=date], input[type=time], select{
    width:100%; background:var(--panel); border:1px solid var(--line); color:var(--text);
    font-family:var(--mono); font-size:13.5px; padding:10px 11px; border-radius:7px;
  }
  textarea{
    width:100%; min-height:52vh; background:var(--panel); border:1px solid var(--line);
    color:var(--text); font-family:var(--mono); font-size:13px; line-height:1.55;
    padding:12px; border-radius:8px; resize:vertical;
  }
  .editor-topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px;}
  .editor-topbar .name{font-family:var(--mono); font-size:12.5px; color:var(--text-dim); word-break:break-all;}
  .CodeMirror{
    height:52vh; min-height:320px;
    background:var(--panel); color:var(--text);
    font-family:var(--mono); font-size:13px; line-height:1.55;
    border:1px solid var(--line); border-radius:8px;
  }
  .CodeMirror-gutters{background:var(--panel); border-right:1px solid var(--line);}
  .CodeMirror-foldgutter{width:16px;}
  .CodeMirror-foldgutter-open:after{content:"▾"; color:var(--text-dim); cursor:pointer; padding-left:2px;}
  .CodeMirror-foldgutter-folded:after{content:"▸"; color:var(--accent); cursor:pointer; padding-left:2px;}
  .CodeMirror-foldmarker{color:var(--text-dim); font-style:italic; cursor:pointer; padding:0 2px;}
  .CodeMirror-cursor{border-left:1.5px solid var(--accent);}
  .CodeMirror-selected{background:rgba(127,168,111,.25) !important;}
  .CodeMirror pre.CodeMirror-line, .CodeMirror pre.CodeMirror-line-like{color:var(--text);}
  .cm-todo-open{color:var(--blue); font-weight:600;}
  .cm-todo-done{color:var(--accent); font-weight:600;}
  .cm-level-1{color:var(--gold); font-weight:700; font-size:17px;}
  .cm-level-2{color:var(--teal); font-weight:700; font-size:15px;}
  .cm-level-3{color:var(--lavender); font-weight:600; font-size:14px;}
  .cm-level-4{color:var(--text-dim); font-weight:600; font-size:13px;}
  .cm-emph-bold{font-weight:700;}
  .cm-emph-italic{font-style:italic;}
  .cm-emph-underline{text-decoration:underline;}
  .cm-emph-code{font-family:var(--mono); background:rgba(255,255,255,.07); padding:0 3px; border-radius:3px;}
  .cm-emph-strike{text-decoration:line-through; opacity:.65;}
  .cm-table-pipe{color:var(--text-dim);}
  .cm-table-sep{color:var(--line);}
  .cm-searching{background:rgba(217,180,106,.25);}
  .outline-node{}
  .outline-row{
    display:flex; align-items:center; gap:7px; padding:7px 6px; border-radius:6px; cursor:pointer;
  }
  .outline-row:active{background:var(--panel);}
  .caret{
    flex-shrink:0; width:18px; height:18px; background:transparent; border:none; color:var(--text-dim);
    font-size:11px; cursor:pointer; padding:0;
  }
  .caret-empty{width:18px; display:inline-block;}
  .outline-title{font-size:13.5px; flex:1; min-width:0; overflow-wrap:anywhere;}
  .outline-title.todo-open{color:var(--blue);}
  .outline-date{font-family:var(--mono); font-size:10.5px; color:var(--text-dim); flex-shrink:0;}
  .present-btn{
    flex-shrink:0; background:transparent; border:1px solid var(--line); color:var(--accent);
    border-radius:5px; width:24px; height:24px; font-size:10px; cursor:pointer; padding:0;
  }
  .present-overlay{
    display:none; position:fixed; inset:0; z-index:30; background:var(--bg);
    flex-direction:column;
  }
  .present-overlay.open{display:flex;}
  .present-topbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px; font-family:var(--mono); font-size:12px; color:var(--text-dim);
    border-bottom:1px solid var(--line);
  }
  .present-slide{
    flex:1; display:flex; flex-direction:column; justify-content:center;
    padding:8vh 8vw; overflow-y:auto;
  }
  .present-slide h2{
    font-family:var(--mono); color:var(--gold); font-size:clamp(24px,5vw,40px);
    margin:0 0 28px 0; font-weight:700;
  }
  .present-title-heading{
    font-family:var(--mono); color:var(--gold); font-size:clamp(34px,8vw,60px);
    margin:0 0 20px 0; font-weight:700; text-align:center;
  }
  .present-title-body{text-align:center;}
  .present-title-body ul, .present-title-body .present-table{text-align:left; display:inline-block;}
  .present-body p{font-size:clamp(16px,2.6vw,22px); line-height:1.6; margin:0 0 14px 0;}
  .present-body ul{margin:8px 0 0 0; padding-left:22px;}
  .present-body li{font-size:clamp(15px,2.3vw,19px); line-height:1.7; color:var(--text-dim);}
  .present-body li ul li{font-size:clamp(13px,2vw,16px); opacity:.85;}
  .present-images{display:flex; flex-wrap:wrap; gap:14px; margin-top:22px;}
  .present-img{max-width:100%; max-height:48vh; border-radius:10px; display:block;}
  .present-table{border-collapse:collapse; width:100%; margin-top:22px; font-family:var(--mono); font-size:clamp(13px,1.8vw,16px);}
  .present-table th, .present-table td{border:1px solid var(--line); padding:8px 14px; text-align:left;}
  .present-table th{background:var(--panel); color:var(--gold); font-weight:600;}
  .present-table tbody tr:nth-child(even){background:rgba(255,255,255,.03);}
  .present-nav{
    display:flex; justify-content:space-between; gap:10px;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom)) 16px;
    border-top:1px solid var(--line);
  }
  .present-nav button{flex:1;}
  .badge{
    font-family:var(--mono); font-size:9.5px; font-weight:600; letter-spacing:.04em;
    padding:2px 5px; border-radius:4px; flex-shrink:0;
  }
  .badge-TODO{background:rgba(217,180,106,.15); color:var(--gold);}
  .badge-NEXT{background:rgba(217,180,106,.15); color:var(--gold);}
  .badge-WAITING{background:rgba(181,83,60,.15); color:var(--rust);}
  .badge-DONE{background:rgba(127,168,111,.15); color:var(--accent);}
  .badge-CANCELLED{background:rgba(141,138,128,.15); color:var(--text-dim);}
  .outline-children{border-left:1px solid var(--line); margin-left:9px;}
  footer.modeline{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    font-family:var(--mono); font-size:11px; color:var(--text-dim);
    background:var(--panel); border-top:1px solid var(--line);
    padding:8px 12px calc(8px + env(safe-area-inset-bottom)) 12px;
    display:flex; justify-content:space-between; gap:10px;
  }
  footer.modeline .status.ok{color:var(--accent);}
  footer.modeline .status.err{color:var(--rust);}
  footer.modeline .status.busy{color:var(--gold);}
  .fab{
    position:fixed; right:18px; bottom:calc(56px + env(safe-area-inset-bottom));
    width:52px; height:52px; border-radius:50%; z-index:10;
    background:var(--accent-dim); color:#0f1210; border:none;
    font-size:28px; line-height:1; font-weight:600;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,.4); cursor:pointer;
  }
  .fab:active{transform:scale(0.94);}
  .quickadd-overlay{
    display:none; position:fixed; inset:0; z-index:20;
    background:rgba(0,0,0,.55);
    align-items:flex-end; justify-content:center;
  }
  .quickadd-overlay.open{display:flex;}
  .quickadd-sheet{
    width:100%; max-width:480px; background:var(--panel);
    border:1px solid var(--line); border-bottom:none;
    border-radius:14px 14px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)) 16px;
  }
  a{color:var(--accent);}
  ::selection{background:var(--accent-dim); color:#0f1210;}
</style>
</head>
<body>

<header class="tabs" id="tabs">
  <button data-tab="agenda" class="active">agenda</button>
  <button data-tab="files">files</button>
  <button data-tab="settings">settings</button>
</header>

<main id="main"></main>

<footer class="modeline">
  <span id="ml-buffer">*agenda*</span>
  <span id="ml-status" class="status">not configured</span>
</footer>

<button class="fab" onclick="openQuickAdd()" aria-label="Quick add task">+</button>

<div class="quickadd-overlay" id="quickadd-overlay" onclick="if(event.target===this) closeQuickAdd()">
  <div class="quickadd-sheet">
    <div class="row" style="margin:0 0 10px 0;">
      <button class="primary" id="quickadd-type-task" onclick="setQuickAddType('task')">Task</button>
      <button class="ghost" id="quickadd-type-event" onclick="setQuickAddType('event')">Event</button>
    </div>
    <div class="empty" style="margin-bottom:8px;"><span id="quickadd-label">New Task</span></div>
    <input type="text" id="quickadd-input" placeholder="What needs doing?" autocomplete="off">
    <label style="margin-top:10px;">File</label>
    <select id="quickadd-file"><option>loading files…</option></select>
    <label style="margin-top:10px;" id="quickadd-date-label">Date (optional)</label>
    <input type="date" id="quickadd-date">
    <label style="margin-top:10px;">Time (optional)</label>
    <input type="time" id="quickadd-time">
    <div class="row" style="margin-top:12px;">
      <button class="primary" onclick="submitQuickAdd()">Add</button>
      <button class="ghost" onclick="closeQuickAdd()">Cancel</button>
    </div>
  </div>
</div>

<div class="quickadd-overlay" id="eventadd-overlay" onclick="if(event.target===this) closeEventAdd()">
  <div class="quickadd-sheet">
    <div class="empty" style="margin-bottom:8px;">Insert event timestamp</div>
    <label>Date</label>
    <input type="date" id="eventadd-date">
    <label style="margin-top:10px;">Time (optional)</label>
    <input type="time" id="eventadd-time">
    <div class="row" style="margin-top:12px;">
      <button class="primary" onclick="submitEventAdd()">Insert</button>
      <button class="ghost" onclick="closeEventAdd()">Cancel</button>
    </div>
  </div>
</div>

<div class="present-overlay" id="present-overlay">
  <div class="present-topbar">
    <span id="present-counter"></span>
    <button class="ghost" onclick="closePresent()">✕ exit</button>
  </div>
  <div class="present-slide" id="present-slide"></div>
  <div class="present-nav">
    <button class="ghost" onclick="presentPrev()">‹ prev</button>
    <button class="ghost" onclick="presentNext()">next ›</button>
  </div>
</div>

<script>
/* ---------- storage ---------- */
const store = {
  get(k, d=null){ try{ const v = localStorage.getItem(k); return v===null? d : JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

let settings = store.get('gh_settings', {token:'', owner:'', repo:'', branch:'main', notesPath:'notes', captureFile:'inbox.org', eventsFile:'events.org'});
let fileCache = {};   // path -> {content, sha}
let tasksCache = [];  // parsed tasks from last agenda refresh
let currentTab = 'agenda';

/* ---------- github api ---------- */
function ghHeaders(){
  return {
    'Authorization': 'token ' + settings.token,
    'Accept': 'application/vnd.github+json'
  };
}
function apiBase(){
  return `https://api.github.com/repos/${settings.owner}/${settings.repo}`;
}
async function ghGetDir(path){
  const url = `${apiBase()}/contents/${path}?ref=${encodeURIComponent(settings.branch)}`;
  const res = await fetch(url, {headers: ghHeaders()});
  if (res.status === 404) return [];
  if (!res.ok) throw new Error(`GitHub error ${res.status}: ${(await res.json()).message || res.statusText}`);
  return res.json();
}
async function ghGetFile(path){
  const url = `${apiBase()}/contents/${path}?ref=${encodeURIComponent(settings.branch)}`;
  const res = await fetch(url, {headers: ghHeaders()});
  if (!res.ok) throw new Error(`GitHub error ${res.status}: ${(await res.json()).message || res.statusText}`);
  const data = await res.json();
  const content = decodeURIComponent(escape(atob(data.content.replace(/\n/g,''))));
  return {content, sha: data.sha};
}

const IMAGE_MIME = {jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png', gif:'image/gif', webp:'image/webp'};
const imageDataCache = {}; // path -> Promise<dataUrl>, so revisiting a file doesn't re-fetch its images

// Unlike ghGetFile, this must NOT run the content through UTF-8 decoding —
// that's only correct for text files and would corrupt binary image bytes.
async function ghGetImageDataUrl(path){
  if (imageDataCache[path]) return imageDataCache[path];
  const promise = (async () => {
    const url = `${apiBase()}/contents/${path}?ref=${encodeURIComponent(settings.branch)}`;
    const res = await fetch(url, {headers: ghHeaders()});
    if (!res.ok) throw new Error(`GitHub error ${res.status}`);
    const data = await res.json();
    const base64 = data.content.replace(/\n/g, '');
    const ext = (path.split('.').pop() || '').toLowerCase();
    const mime = IMAGE_MIME[ext] || 'image/jpeg';
    return `data:${mime};base64,${base64}`;
  })();
  imageDataCache[path] = promise;
  try{ return await promise; } catch(e){ delete imageDataCache[path]; throw e; }
}

async function ghPutFile(path, content, sha, message){
  const url = `${apiBase()}/contents/${path}`;
  const body = {
    message: message || `Update ${path}`,
    content: btoa(unescape(encodeURIComponent(content))),
    branch: settings.branch
  };
  if (sha) body.sha = sha;
  const res = await fetch(url, {method:'PUT', headers:{...ghHeaders(),'Content-Type':'application/json'}, body: JSON.stringify(body)});
  if (!res.ok){
    if (res.status === 409){
      throw new Error('This file changed elsewhere since it was last loaded here — close and reopen it, then try again.');
    }
    throw new Error(`GitHub error ${res.status}: ${(await res.json()).message || res.statusText}`);
  }
  return res.json();
}
async function listOrgFiles(path){
  let out = [];
  let entries;
  try{ entries = await ghGetDir(path); } catch(e){ throw e; }
  if (!Array.isArray(entries)) return out;
  for (const e of entries){
    if (e.type === 'dir') out = out.concat(await listOrgFiles(e.path));
    else if (e.type === 'file' && e.path.endsWith('.org')) out.push(e.path);
  }
  return out;
}

/* ---------- org parsing ---------- */
const HEADLINE_RE = /^(\*+)\s+(TODO|NEXT|WAITING|DONE|CANCELLED)?\s*(?:\[#([A-Za-z0-9]+)\]\s*)?(.*)$/;
const DATE_RE = /(SCHEDULED|DEADLINE):\s*<([^>]+)>/g;
const PLAIN_TIMESTAMP_RE = /<([^>]+)>/;

// Parses the inside of a timestamp, e.g. "2026-08-25 Tue 14:00 +1y", into its
// date, optional time, and optional repeater (n + unit: d/w/m/y).
function parseTimestampInner(inner){
  const dateMatch = inner.match(/(\d{4}-\d{2}-\d{2})/);
  const timeMatch = inner.match(/(\d{2}:\d{2})/);
  const repMatch = inner.match(/\+(\d+)([dwmy])/);
  return {
    date: dateMatch ? dateMatch[1] : null,
    time: timeMatch ? timeMatch[1] : null,
    repeat: repMatch ? {n: Number(repMatch[1]), unit: repMatch[2]} : null
  };
}

function parseOrgFile(path, text){
  const lines = text.split('\n');
  const tasks = [];
  for (let i=0; i<lines.length; i++){
    const m = lines[i].match(HEADLINE_RE);
    if (!m) continue;
    const state = m[2] || null;
    const priority = m[3] || null;
    const title = m[4].trim();
    const nextLine = lines[i+1] || '';
    // The priority cookie [#X] normally holds a letter (A/B/C), but drag
    // order on the Agenda page is stored the same way, just with a plain
    // number instead — e.g. [#3] — so it stays a compact, single-line
    // edit rather than a multi-line properties drawer.
    const order = priority && /^\d+$/.test(priority) ? parseInt(priority, 10) : null;

    if (state){
      // A task: TODO/NEXT/WAITING/DONE/CANCELLED, dated via SCHEDULED/DEADLINE.
      let scheduled = null, scheduledRepeat = null, deadline = null, deadlineRepeat = null;
      let dm;
      DATE_RE.lastIndex = 0;
      while ((dm = DATE_RE.exec(nextLine)) !== null){
        const parsed = parseTimestampInner(dm[2]);
        if (dm[1] === 'SCHEDULED'){ scheduled = parsed.date; scheduledRepeat = parsed.repeat; }
        if (dm[1] === 'DEADLINE'){ deadline = parsed.date; deadlineRepeat = parsed.repeat; }
      }
      tasks.push({file: path, lineIndex: i, type: 'task', state, priority, title, scheduled, scheduledRepeat, deadline, deadlineRepeat, order});
    } else {
      // No keyword — treat a headline with a plain timestamp underneath it
      // as an event/appointment rather than a task.
      const tm = nextLine.match(PLAIN_TIMESTAMP_RE);
      if (tm && title){
        const parsed = parseTimestampInner(tm[1]);
        if (parsed.date){
          tasks.push({file: path, lineIndex: i, type: 'event', title, scheduled: parsed.date, scheduledRepeat: parsed.repeat, deadline: null, deadlineRepeat: null, time: parsed.time, order});
        }
      }
    }
  }
  return tasks;
}

function parseISODate(s){
  const [y, mo, d] = s.split('-').map(Number);
  return new Date(y, mo - 1, d);
}

// Does an item anchored on `anchorStr` (with optional `repeat`) occur on
// `targetStr`? Non-repeating items only match their exact date; repeating
// items match the anchor date plus any whole number of intervals forward.
function occursOnDate(anchorStr, repeat, targetStr){
  if (!anchorStr) return false;
  if (anchorStr === targetStr) return true;
  if (!repeat) return false;
  const anchor = parseISODate(anchorStr);
  const target = parseISODate(targetStr);
  if (target < anchor) return false;
  if (repeat.unit === 'd'){
    const days = Math.round((target - anchor) / 86400000);
    return days % repeat.n === 0;
  }
  if (repeat.unit === 'w'){
    const days = Math.round((target - anchor) / 86400000);
    return days % (repeat.n * 7) === 0;
  }
  if (repeat.unit === 'm'){
    if (target.getDate() !== anchor.getDate()) return false;
    const months = (target.getFullYear() - anchor.getFullYear()) * 12 + (target.getMonth() - anchor.getMonth());
    return months >= 0 && months % repeat.n === 0;
  }
  if (repeat.unit === 'y'){
    if (target.getDate() !== anchor.getDate() || target.getMonth() !== anchor.getMonth()) return false;
    const years = target.getFullYear() - anchor.getFullYear();
    return years >= 0 && years % repeat.n === 0;
  }
  return false;
}

function repeatLabel(repeat){
  if (!repeat) return '';
  if (repeat.unit === 'd') return repeat.n === 1 ? 'daily' : `every ${repeat.n} days`;
  if (repeat.unit === 'w') return repeat.n === 1 ? 'weekly' : (repeat.n === 2 ? 'fortnightly' : `every ${repeat.n} weeks`);
  if (repeat.unit === 'm') return repeat.n === 1 ? 'monthly' : `every ${repeat.n} months`;
  if (repeat.unit === 'y') return repeat.n === 1 ? 'yearly' : `every ${repeat.n} years`;
  return '';
}

/* ---------- calendar (.ics) export ---------- */
function icsEscape(text){
  return String(text).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}

// RFC 5545 requires folding lines over 75 octets, continued with CRLF + a space.
function foldICSLine(line){
  if (line.length <= 75) return line;
  let out = '', i = 0;
  while (i < line.length){
    out += (i === 0 ? '' : '\r\n ') + line.slice(i, i + 74);
    i += 74;
  }
  return out;
}

function addDaysISO(dateStr, days){
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + days);
  return localDateStr(dt);
}

function buildICS(events){
  const dtstamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
  const freqMap = {d:'DAILY', w:'WEEKLY', m:'MONTHLY', y:'YEARLY'};
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Agenda App//EN','CALSCALE:GREGORIAN'];
  events.forEach((t, idx) => {
    lines.push('BEGIN:VEVENT');
    lines.push(foldICSLine(`UID:agenda-event-${idx}-${t.scheduled}@${settings.repo}`));
    lines.push('DTSTAMP:' + dtstamp);
    if (t.time){
      // Floating local time (no Z / TZID) — interpreted in the viewer's own timezone.
      lines.push('DTSTART:' + t.scheduled.replace(/-/g,'') + 'T' + t.time.replace(':','') + '00');
      lines.push('DURATION:PT1H');
    } else {
      lines.push('DTSTART;VALUE=DATE:' + t.scheduled.replace(/-/g,''));
      lines.push('DTEND;VALUE=DATE:' + addDaysISO(t.scheduled, 1).replace(/-/g,''));
    }
    if (t.scheduledRepeat){
      lines.push(`RRULE:FREQ=${freqMap[t.scheduledRepeat.unit]};INTERVAL=${t.scheduledRepeat.n}`);
    }
    lines.push(foldICSLine('SUMMARY:' + icsEscape(t.title)));
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n') + '\r\n';
}

async function syncCalendar(){
  setStatus('busy', 'syncing calendar…');
  try{
    const events = tasksCache.filter(t => t.type === 'event' && t.scheduled);
    const ics = buildICS(events);
    let existing = null;
    try{ existing = await ghGetFile('agenda.ics'); } catch(e){ existing = null; }
    await ghPutFile('agenda.ics', ics, existing ? existing.sha : null, 'Update agenda.ics');
    setStatus('ok', `synced ${events.length} event${events.length === 1 ? '' : 's'}`);
  }catch(e){
    setStatus('err', e.message);
  }
}

function todayStr(){
  return localDateStr(new Date());
}

function localDateStr(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function dayLabel(d, offset){
  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dateStr = `${dayNames[d.getDay()]} ${d.getDate()} ${monthNames[d.getMonth()]}`;
  if (offset === 0) return `Today · ${dateStr}`;
  if (offset === 1) return `Tomorrow · ${dateStr}`;
  return dateStr;
}

/* ---------- agenda ---------- */
async function refreshAgenda(){
  setStatus('busy', 'syncing…');
  try{
    const files = await listOrgFiles(settings.notesPath);
    const all = [];
    for (const path of files){
      const {content, sha} = await ghGetFile(path);
      fileCache[path] = {content, sha};
      all.push(...parseOrgFile(path, content));
    }
    tasksCache = all;
    setStatus('ok', `synced ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`);
  }catch(e){
    setStatus('err', e.message);
  }
  renderAgenda();
}

function orderSort(a, b){
  const ao = a.order == null ? Infinity : a.order, bo = b.order == null ? Infinity : b.order;
  if (ao !== bo) return ao - bo;
  return (a.time || '99:99').localeCompare(b.time || '99:99');
}

function renderAgenda(){
  const today = todayStr();
  const open = tasksCache.filter(t => {
    if (t.state === 'DONE' || t.state === 'CANCELLED') return false;
    // Events are appointments, not obligations — once a *non-repeating*
    // event's date has passed, drop it rather than piling it up in
    // Overdue. Repeating events keep their (often long-past) anchor date
    // forever, so this must not apply to them.
    if (t.type === 'event' && !t.scheduledRepeat && t.scheduled && t.scheduled < today) return false;
    return true;
  });
  const overdue = open.filter(t => {
    // A repeating item is never "overdue" — it just recurs — so only
    // non-repeating scheduled/deadline dates count here.
    if (t.scheduledRepeat || t.deadlineRepeat) return false;
    const d = t.deadline || t.scheduled;
    return d && d < today;
  }).sort(orderSort);
  const unscheduled = open.filter(t => !t.scheduled && !t.deadline).sort(orderSort);

  const main = document.getElementById('main');
  if (!settings.token || !settings.owner || !settings.repo){
    main.innerHTML = `<h1><span class="star">*</span> agenda</h1><div class="empty">Not connected yet — head to the Settings tab and add your repo details.</div>`;
    return;
  }

  let days = '';
  const base = new Date();
  base.setHours(0,0,0,0);
  for (let i = 0; i <= 7; i++){
    const d = new Date(base);
    d.setDate(base.getDate() + i);
    const key = localDateStr(d);
    const dayTasks = open.filter(t =>
        occursOnDate(t.scheduled, t.scheduledRepeat, key) ||
        occursOnDate(t.deadline, t.deadlineRepeat, key)
      )
      .sort(orderSort);
    days += dayGroup(i === 0 ? 'today' : 'upcoming', dayLabel(d, i), dayTasks);
  }

  main.innerHTML = `<h1><span class="star">*</span> agenda</h1>` +
    `<div class="row" style="margin-bottom:16px;">
       <button class="ghost" onclick="refreshAgenda()">↻ refresh</button>
       <button class="ghost" onclick="syncCalendar()">☁ sync to calendar</button>
     </div>` +
    group('overdue', 'Overdue', overdue) +
    days +
    group('unscheduled', 'Unscheduled', unscheduled);
}

function taskRow(t, cls){
  const repeat = t.deadlineRepeat || t.scheduledRepeat;
  const repLabel = repeat ? repeatLabel(repeat) : '';
  const dateLabel = t.deadline ? `deadline ${t.deadline}` : (t.scheduled ? `scheduled ${t.scheduled}` : '');
  const idx = tasksCache.indexOf(t);
  const dragHandle = `<button class="drag-handle" aria-label="drag to reorder" title="drag to reorder">⠿</button>`;
  if (t.type === 'event'){
    const timeLabel = t.time ? `${t.time} · ` : '';
    return `<div class="task ${cls} event" data-file="${escapeHtml(t.file)}" data-line="${t.lineIndex}">
      <span class="dot" aria-hidden="true"></span>
      <div class="body">
        <div class="title">${escapeHtml(t.title)}</div>
        <div class="meta">${timeLabel}<span class="file">${escapeHtml(t.file.split('/').pop())}</span>${repLabel ? ' · ' + repLabel : ''}</div>
      </div>
      ${dragHandle}
    </div>`;
  }
  return `<div class="task ${cls}" data-file="${escapeHtml(t.file)}" data-line="${t.lineIndex}">
    <button class="box" onclick="toggleTask(${idx})" aria-label="mark done"></button>
    <div class="body">
      <div class="title">${escapeHtml(t.title)}</div>
      <div class="meta"><span class="file">${escapeHtml(t.file.split('/').pop())}</span>${dateLabel ? ' · ' + dateLabel : ''}${repLabel ? ' · ' + repLabel : ''}</div>
    </div>
    ${dragHandle}
  </div>`;
}

function group(cls, label, items){
  if (!items.length) return '';
  return `<section class="group ${cls}"><h2>${label}</h2>${items.map(t => taskRow(t, cls)).join('')}</section>`;
}

function dayGroup(cls, label, items){
  const rows = items.length
    ? items.map(t => taskRow(t, cls)).join('')
    : `<div class="empty" style="padding:4px 2px;">nothing scheduled</div>`;
  return `<section class="group ${cls}"><h2>${label}</h2>${rows}</section>`;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function toggleTask(idx){
  const t = tasksCache[idx];
  if (!t) return;
  const cached = fileCache[t.file];
  if (!cached) return;
  const lines = cached.content.split('\n');
  lines[t.lineIndex] = lines[t.lineIndex].replace(/^(\*+\s+)(TODO|NEXT|WAITING)\b/, '$1DONE');
  const newContent = lines.join('\n');
  setStatus('busy', 'saving…');
  try{
    const res = await ghPutFile(t.file, newContent, cached.sha, `Mark done: ${t.title}`);
    fileCache[t.file] = {content: newContent, sha: res.content.sha};
    t.state = 'DONE';
    setStatus('ok', 'saved');
    renderAgenda();
  }catch(e){
    setStatus('err', e.message);
  }
}

/* ---------- agenda drag-to-reorder ---------- */
// Writes/updates a numeric :ORDER: property in a task's own
// :PROPERTIES: drawer (creating the drawer if it doesn't exist yet),
// working on plain text so it can run without that file's editor open.
// Writes the drag-order value as a numeric priority cookie — [#N] — right
// on the headline line itself, replacing any existing cookie (letter or
// number). Since this only rewrites one line's text rather than inserting
// new lines, the file's total line count never changes.
function setOrderInContent(content, lineIndex, orderValue){
  const lines = content.split('\n');
  const line = lines[lineIndex];
  const m = line.match(/^(\*+\s+)((?:TODO|NEXT|WAITING|DONE|CANCELLED)\s+)?(?:\[#[A-Za-z0-9]+\]\s*)?(.*)$/);
  if (!m) return content;
  lines[lineIndex] = `${m[1]}${m[2] || ''}[#${orderValue}] ${m[3]}`;
  return lines.join('\n');
}

// orderedTasks: [{file, lineIndex}, ...] in their final drag order.
// Tasks are grouped by file and, within a file, processed bottom-to-top so
// that inserting drawer lines for one task never shifts the line numbers
// of tasks still waiting to be processed above it.
let reorderInFlight = false;

async function persistTaskOrder(orderedTasks){
  reorderInFlight = true;
  const byFile = {};
  orderedTasks.forEach((t, idx) => {
    (byFile[t.file] = byFile[t.file] || []).push({lineIndex: t.lineIndex, order: idx});
  });
  setStatus('busy', 'saving order…');
  try{
    for (const file of Object.keys(byFile)){
      const {content, sha} = await ghGetFile(file);
      let updated = content;
      const items = byFile[file]; // rewriting each headline in place, so processing order doesn't matter here
      items.forEach(item => { updated = setOrderInContent(updated, item.lineIndex, item.order); });
      const res = await ghPutFile(file, updated, sha, 'Update task order');
      fileCache[file] = {content: updated, sha: res.content.sha};
    }
    setStatus('ok', 'order saved');
  }catch(e){
    setStatus('err', e.message);
  }
  await refreshAgenda();
  reorderInFlight = false;
}

let dragState = null;

function initAgendaDragHandlers(){
  const main = document.getElementById('main');

  main.addEventListener('pointerdown', e => {
    if (reorderInFlight) return; // a previous drag is still saving — starting another here would race it
    const handle = e.target.closest('.drag-handle');
    if (!handle) return;
    const row = handle.closest('.task');
    const section = row && row.closest('.group');
    if (!row || !section) return;
    e.preventDefault();
    dragState = {row, section};
    row.classList.add('dragging');
    try{ handle.setPointerCapture(e.pointerId); }catch(err){}
  });

  main.addEventListener('pointermove', e => {
    if (!dragState) return;
    e.preventDefault();
    const {row, section} = dragState;
    const siblings = Array.from(section.querySelectorAll(':scope > .task')).filter(r => r !== row);
    let target = null;
    for (const sib of siblings){
      const rect = sib.getBoundingClientRect();
      if (e.clientY < rect.top + rect.height / 2){ target = sib; break; }
    }
    if (target){
      if (row.nextSibling !== target) section.insertBefore(row, target);
    } else if (section.lastElementChild !== row){
      section.appendChild(row);
    }
  });

  const finishDrag = () => {
    if (!dragState) return;
    const {row, section} = dragState;
    row.classList.remove('dragging');
    const orderedTasks = Array.from(section.querySelectorAll(':scope > .task'))
      .map(r => ({file: r.dataset.file, lineIndex: parseInt(r.dataset.line, 10)}));
    dragState = null;
    persistTaskOrder(orderedTasks);
  };
  main.addEventListener('pointerup', finishDrag);
  main.addEventListener('pointercancel', finishDrag);
}

// Minimal highlighting mode: colors the TODO-state keyword at the start of
// a headline, leaving everything else as plain text.
CodeMirror.defineMode('org-highlight', function(){
  const emphasisPatterns = [
    {re: /^\*([^\s*](?:[^*]*[^\s*])?)\*/, cls: 'emph-bold'},
    {re: /^\/([^\s\/](?:[^\/]*[^\s\/])?)\//, cls: 'emph-italic'},
    {re: /^_([^\s_](?:[^_]*[^\s_])?)_/, cls: 'emph-underline'},
    {re: /^=([^\s=](?:[^=]*[^\s=])?)=/, cls: 'emph-code'},
    {re: /^~([^\s~](?:[^~]*[^\s~])?)~/, cls: 'emph-code'},
    {re: /^\+([^\s+](?:[^+]*[^\s+])?)\+/, cls: 'emph-strike'}
  ];
  return {
    startState: function(){ return {headlineMatch: null, level: null, isTableSep: false}; },
    token: function(stream, state){
      if (stream.sol()){
        state.headlineMatch = stream.string.match(/^(\*+)(\s+)(TODO|NEXT|WAITING|DONE|CANCELLED)?/);
        state.level = state.headlineMatch ? Math.min(state.headlineMatch[1].length, 4) : null;
        state.isTableSep = !state.headlineMatch && isTableSepRow(stream.string);
      }
      const m = state.headlineMatch;
      const pos = stream.pos;
      const levelCls = state.level ? ('level-' + state.level) : null;

      if (!m && state.isTableSep && pos === 0){
        stream.skipToEnd();
        return 'table-sep'; // the |----+----| divider row, dimmed as one unit
      }
      if (m && pos === 0){
        stream.pos = m[1].length;
        return levelCls; // stars: color + size for this heading level
      }
      if (m && pos === m[1].length){
        stream.pos = m[1].length + m[2].length;
        return null; // the space between stars and keyword/title
      }
      if (m && m[3] && pos === m[1].length + m[2].length){
        stream.pos = m[1].length + m[2].length + m[3].length;
        // Keyword keeps its own status color rather than the level color,
        // so open/done stays legible regardless of heading depth.
        return (m[3] === 'DONE' || m[3] === 'CANCELLED') ? 'todo-done' : 'todo-open';
      }
      // Remaining text — the heading's title, or a plain body line. Check
      // for an org emphasis span starting right here.
      const rest = stream.string.slice(stream.pos);
      if (rest[0] === '|'){
        stream.pos += 1;
        return levelCls ? (levelCls + ' table-pipe') : 'table-pipe'; // dim the pipe so cell content stands out
      }
      for (const p of emphasisPatterns){
        const em = rest.match(p.re);
        if (em){
          stream.pos += em[0].length;
          return levelCls ? (levelCls + ' ' + p.cls) : p.cls;
        }
      }
      // Consume up to the next character that could start something special
      // (a pipe or an emphasis marker) in one go, rather than one character
      // at a time — tokenizing char-by-char was generating a huge number of
      // tiny spans on longer lines (especially padded table rows), which is
      // exactly the kind of extra rendering work that can make an editor
      // stutter or visibly lag during typing.
      const nextSpecial = rest.slice(1).search(/[|*/_=~+]/);
      stream.pos = nextSpecial === -1 ? stream.string.length : stream.pos + 1 + nextSpecial;
      return levelCls; // plain title text still gets the heading's size; plain body text gets null
    }
  };
});

function initRawEditor(content, path){
  cmInstance = CodeMirror(document.getElementById('editor-cm'), {
    value: content,
    mode: 'org-highlight',
    lineNumbers: false,
    lineWrapping: true,
    gutters: ['CodeMirror-foldgutter'],
    foldGutter: {rangeFinder: orgRangeFinder}
  });
  cmInstance.setOption('extraKeys', {
    'Ctrl-Alt-T': cm => toggleTodoAtCursor(cm),
    'Ctrl-Alt-E': cm => insertEventAtCursor(cm),
    'Tab': cm => {
      if (isTableLine(cm.getLine(cm.getCursor().line))){
        alignTable(cm);
        return;
      }
      return CodeMirror.Pass; // not in a table — use CodeMirror's normal Tab behavior
    }
  });
  let reconcileTimer = null;
  const reconcile = () => {
    if (!cmInstance) return;
    suppressAutoFix = true;
    cmInstance.operation(() => {
      try{
        fixTimestampWeekdaysInEditor(cmInstance);
        applyPersistedFolds(cmInstance, path);
        applyHideDoneFolds(cmInstance);
      }catch(e){
        console.error('editor auto-fix error:', e);
      }
    });
    suppressAutoFix = false;
  };
  cmInstance.on('changes', () => {
    if (suppressAutoFix) return;
    // Debounced: this does a handful of full-document passes, which is
    // instant on a pause but was previously running on every single
    // keystroke — that's what caused the typing lag.
    clearTimeout(reconcileTimer);
    reconcileTimer = setTimeout(reconcile, 400);
  });
  cmInstance.on('fold', (cm, from) => { if (!suppressAutoFix) recordFoldChange(cm, path, from.line, true); });
  cmInstance.on('unfold', (cm, from) => { if (!suppressAutoFix) recordFoldChange(cm, path, from.line, false); });
  if (window._jumpToLine !== undefined){
    const line = window._jumpToLine;
    cmInstance.setCursor({line, ch: 0});
    cmInstance.scrollIntoView({line, ch: 0}, 100);
    window._jumpToLine = undefined;
  }
  setTimeout(() => {
    if (!cmInstance) return;
    cmInstance.refresh();
    suppressAutoFix = true;
    cmInstance.operation(() => {
      applyPersistedFolds(cmInstance, path);
      applyHideDoneFolds(cmInstance);
    });
    suppressAutoFix = false;
    renderImagePreviews(cmInstance); // fire-and-forget: runs once per file open, not on every edit
  }, 30);
}

// Scans the file for [[path/to/image.ext]] links and renders each as an
// inline preview widget. Only run once when a file is opened (not part of
// the debounced per-edit reconciliation) — re-scanning the whole document
// on every keystroke is exactly the kind of cost that caused the earlier
// typing-lag issue.
async function renderImagePreviews(cm){
  const lineCount = cm.lineCount();
  for (let i = 0; i < lineCount; i++){
    const line = cm.getLine(i);
    const m = line.match(/\[\[([^\]]+\.(?:png|jpe?g|gif|webp))\]\]/i);
    if (!m) continue;
    const imgPath = m[1];
    try{
      const dataUrl = await ghGetImageDataUrl(imgPath);
      if (cmInstance !== cm) return; // user navigated away while this was loading
      const img = document.createElement('img');
      img.src = dataUrl;
      img.style.maxWidth = '220px';
      img.style.maxHeight = '220px';
      img.style.borderRadius = '8px';
      img.style.display = 'block';
      img.style.margin = '4px 0 8px 0';
      cm.addLineWidget(i, img);
    }catch(e){
      console.error('image preview failed for', imgPath, e);
    }
  }
}

// Identify a headline by level+title (same convention Outline view uses)
// rather than by line number, so it stays matched even as the file above
// it changes length.
function headlineKeyAtLine(cm, path, lineIndex){
  const line = cm.getLine(lineIndex);
  const m = line.match(/^(\*+)\s+(?:TODO|NEXT|WAITING|DONE|CANCELLED)?\s?(.*)$/);
  if (!m) return null;
  return path + '::' + m[1].length + '::' + m[2].trim();
}

// Re-fold anything that's supposed to be folded per the persisted set. This
// is what actually makes folds durable: rather than trusting CodeMirror's
// internal fold markers to survive edits, we treat the persisted set as the
// source of truth and re-apply it after every change.
function applyPersistedFolds(cm, path){
  const cursorLine = cm.getCursor().line;
  const lineCount = cm.lineCount();
  for (let i = 0; i < lineCount; i++){
    const key = headlineKeyAtLine(cm, path, i);
    if (key && outlineCollapsed.has(key)){
      const range = orgRangeFinder(cm, CodeMirror.Pos(i, 0));
      if (range && cursorLine >= range.from.line && cursorLine <= range.to.line) continue; // cursor is inside — leave it visible for now
      cm.foldCode(CodeMirror.Pos(i, 0), {rangeFinder: orgRangeFinder}, 'fold');
    }
  }
}

function recordFoldChange(cm, path, lineIndex, isFolded){
  const key = headlineKeyAtLine(cm, path, lineIndex);
  if (!key) return;
  if (isFolded) outlineCollapsed.add(key);
  else outlineCollapsed.delete(key);
  store.set('outline_collapsed', Array.from(outlineCollapsed));
}

// Org-style subtree folding: fold everything below a headline down to (but
// not including) the next headline at the same or a shallower level.
function orgRangeFinder(cm, start){
  const startLine = start.line;
  const lineText = cm.getLine(startLine);
  const m = lineText.match(/^(\*+)\s/);
  if (!m) return null;
  const level = m[1].length;
  const lastLine = cm.lastLine();
  let endLine = startLine;
  for (let i = startLine + 1; i <= lastLine; i++){
    const t = cm.getLine(i);
    const mm = t.match(/^(\*+)\s/);
    if (mm && mm[1].length <= level) break;
    endLine = i;
  }
  if (endLine === startLine) return null;
  return {
    from: CodeMirror.Pos(startLine, lineText.length),
    to: CodeMirror.Pos(endLine, cm.getLine(endLine).length)
  };
}

// Like orgRangeFinder, but only matches DONE/CANCELLED headlines, and folds
// starting from column 0 (rather than the end of the headline text) so the
// completed headline's own line is hidden too, not just its children.
function doneRangeFinder(cm, start){
  const startLine = start.line;
  const lineText = cm.getLine(startLine);
  const m = lineText.match(/^(\*+)\s+(DONE|CANCELLED)\b/);
  if (!m) return null;
  const level = m[1].length;
  const lastLine = cm.lastLine();
  let endLine = startLine;
  for (let i = startLine + 1; i <= lastLine; i++){
    const t = cm.getLine(i);
    const mm = t.match(/^(\*+)\s/);
    if (mm && mm[1].length <= level) break;
    endLine = i;
  }
  // Extend to the start of the following line (rather than stopping at the
  // end of endLine) so the fold swallows the trailing newline too — this is
  // what makes the row disappear completely instead of leaving an empty line.
  const to = endLine < lastLine
    ? CodeMirror.Pos(endLine + 1, 0)
    : CodeMirror.Pos(endLine, cm.getLine(endLine).length);
  return { from: CodeMirror.Pos(startLine, 0), to };
}

// Folding is purely visual — cm.getValue() always returns the full,
// unmodified text regardless of what's currently hidden — so toggling this
// can never lose or alter any content, saved or not.
function applyHideDoneFolds(cm){
  const cursorLine = cm.getCursor().line;
  const lineCount = cm.lineCount();
  for (let i = 0; i < lineCount; i++){
    const line = cm.getLine(i);
    if (!/^\*+\s+(DONE|CANCELLED)\b/.test(line)) continue;
    if (hideDoneItems){
      const range = doneRangeFinder(cm, CodeMirror.Pos(i, 0));
      if (range && cursorLine >= range.from.line && cursorLine <= range.to.line) continue; // cursor is inside — don't hide it mid-edit
    }
    cm.foldCode(CodeMirror.Pos(i, 0), {rangeFinder: doneRangeFinder, widget: ''}, hideDoneItems ? 'fold' : 'unfold');
  }
}

function toggleHideDoneRaw(){
  hideDoneItems = !hideDoneItems;
  if (cmInstance) applyHideDoneFolds(cmInstance);
  const btn = document.getElementById('hide-done-btn');
  if (btn) btn.textContent = hideDoneItems ? 'show done' : 'hide done';
}

function switchEditorView(path, view){
  editorView = view;
  renderEditorPane(path);
}

function toggleHideDone(path){
  hideDoneItems = !hideDoneItems;
  renderEditorPane(path);
}

function filterDoneNodes(nodes){
  return nodes
    .filter(n => n.state !== 'DONE' && n.state !== 'CANCELLED')
    .map(n => ({...n, children: filterDoneNodes(n.children)}));
}

/* ---------- outline tree ---------- */
function buildOutlineTree(content){
  const lines = content.split('\n');
  const root = {level: 0, children: []};
  const stack = [root];
  for (let i=0; i<lines.length; i++){
    const m = lines[i].match(HEADLINE_RE);
    if (!m) continue;
    const level = m[1].length;
    const state = m[2] || null;
    const title = (m[4] || '').trim();
    let scheduled = null, deadline = null, repeat = null;
    if (lines[i+1]){
      let dm; DATE_RE.lastIndex = 0;
      while ((dm = DATE_RE.exec(lines[i+1])) !== null){
        const parsed = parseTimestampInner(dm[2]);
        if (dm[1] === 'SCHEDULED'){ scheduled = parsed.date; repeat = parsed.repeat; }
        if (dm[1] === 'DEADLINE'){ deadline = parsed.date; repeat = parsed.repeat; }
      }
      if (!scheduled && !deadline && !state){
        const tm = lines[i+1].match(PLAIN_TIMESTAMP_RE);
        if (tm){
          const parsed = parseTimestampInner(tm[1]);
          scheduled = parsed.date;
          repeat = parsed.repeat;
        }
      }
    }
    const node = {level, state, title, scheduled, deadline, repeat, lineIndex: i, children: []};
    while (stack.length && stack[stack.length-1].level >= level) stack.pop();
    stack[stack.length-1].children.push(node);
    stack.push(node);
  }
  return root.children;
}

/* ---------- presentation mode ---------- */
function headlineTitleFromLine(line){
  const m = line.match(HEADLINE_RE);
  return m ? (m[4] || '').trim() : line.trim();
}

// Turns a headline's subtree into slides: one slide per direct child, using
// that child's own body text as the slide content and any of *its*
// children's titles as bullet points. If the chosen headline has no
// children, its own body becomes a single slide instead.
function buildSlidesFromHeadline(content, rootLine){
  const lines = content.split('\n');
  const rootMatch = lines[rootLine].match(/^(\*+)\s/);
  if (!rootMatch) return [];
  const rootLevel = rootMatch[1].length;
  const lastLine = lines.length - 1;

  let subtreeEnd = rootLine;
  for (let i = rootLine + 1; i <= lastLine; i++){
    const m = lines[i].match(/^(\*+)\s/);
    if (m && m[1].length <= rootLevel) break;
    subtreeEnd = i;
  }

  const isMeta = line => /^\s*(SCHEDULED|DEADLINE):/.test(line) || /^\s*<\d{4}-\d{2}-\d{2}/.test(line);
  const imageLinkRe = /^\[\[([^\]]+\.(?:png|jpe?g|gif|webp))\]\]$/i;

  // Groups consecutive table lines into a structured {headerRows, dataRows}
  // table object — rows above the first divider become the header.
  function parseTableBlock(tableLines){
    const sepIdx = tableLines.findIndex(isTableSepRow);
    const headerRows = [], dataRows = [];
    tableLines.forEach((l, i) => {
      if (isTableSepRow(l)) return;
      const cells = parseTableRow(l);
      (sepIdx !== -1 && i < sepIdx ? headerRows : dataRows).push(cells);
    });
    return {headerRows, dataRows};
  }

  // Walks a line range, splitting it into body paragraphs, a nested bullet
  // tree (from any depth of sub-headlines, not just the immediate level),
  // image links, and table blocks. baseLevel is the heading level of the
  // section itself, so anything found here is baseLevel+1 or deeper.
  function collectSectionContent(fromLine, toLine, baseLevel){
    const bodyLines = [], images = [], tables = [];
    const bulletRoot = {level: baseLevel, children: []};
    const bulletStack = [bulletRoot];
    let tableBuffer = [];
    const flushTable = () => {
      if (tableBuffer.length){ tables.push(parseTableBlock(tableBuffer)); tableBuffer = []; }
    };
    for (let i = fromLine; i <= toLine; i++){
      const line = lines[i];
      const trimmed = line.trim();
      if (isTableLine(trimmed)){ tableBuffer.push(trimmed); continue; }
      flushTable();
      const levelMatch = line.match(/^(\*+)\s/);
      if (levelMatch){
        const hm = line.match(HEADLINE_RE);
        const level = levelMatch[1].length;
        const node = {title: (hm ? hm[4] : line.replace(/^\*+\s+/, '')).trim(), level, children: []};
        while (bulletStack.length && bulletStack[bulletStack.length - 1].level >= level) bulletStack.pop();
        bulletStack[bulletStack.length - 1].children.push(node);
        bulletStack.push(node);
        continue;
      }
      if (isMeta(line)) continue;
      if (!trimmed) continue;
      const im = trimmed.match(imageLinkRe);
      if (im){ images.push(im[1]); continue; }
      bodyLines.push(trimmed.replace(/^[-+]\s+/, ''));
    }
    flushTable();
    return {bodyLines, bullets: bulletRoot.children, images, tables};
  }

  const childIndices = [];
  for (let i = rootLine + 1; i <= subtreeEnd; i++){
    const m = lines[i].match(/^(\*+)\s/);
    if (m && m[1].length === rootLevel + 1) childIndices.push(i);
  }

  if (!childIndices.length){
    return [{title: headlineTitleFromLine(lines[rootLine]), ...collectSectionContent(rootLine + 1, subtreeEnd, rootLevel), isTitle: true}];
  }

  const titleSlide = {
    title: headlineTitleFromLine(lines[rootLine]),
    ...collectSectionContent(rootLine + 1, childIndices[0] - 1, rootLevel),
    isTitle: true
  };
  const contentSlides = childIndices.map((ci, idx) => {
    const childEnd = idx + 1 < childIndices.length ? childIndices[idx + 1] - 1 : subtreeEnd;
    return {title: headlineTitleFromLine(lines[ci]), ...collectSectionContent(ci + 1, childEnd, rootLevel + 1)};
  });
  return [titleSlide, ...contentSlides];
}

let presentSlides = [];
let presentIndex = 0;
let presentRenderToken = 0;
let presentRevealCount = 0; // how many of the current slide's top-level bullets are shown

function startPresent(path, lineIndex){
  const content = fileCache[path] ? fileCache[path].content : null;
  if (!content) return;
  presentSlides = buildSlidesFromHeadline(content, lineIndex);
  if (!presentSlides.length){ setStatus('err', 'nothing to present here'); return; }
  presentIndex = 0;
  presentRevealCount = 0;
  document.getElementById('present-overlay').classList.add('open');
  renderPresentSlide();
}

function closePresent(){
  document.getElementById('present-overlay').classList.remove('open');
}

function renderTableHtml(t){
  const thead = t.headerRows.length
    ? `<thead>${t.headerRows.map(r => '<tr>' + r.map(c => `<th>${escapeHtml(c)}</th>`).join('') + '</tr>').join('')}</thead>`
    : '';
  const tbody = `<tbody>${t.dataRows.map(r => '<tr>' + r.map(c => `<td>${escapeHtml(c)}</td>`).join('') + '</tr>').join('')}</tbody>`;
  return `<table class="present-table">${thead}${tbody}</table>`;
}

// Renders a bullet tree of any depth — a bullet's own children (if any)
// nest as a sub-list inside its <li>, so sub-headlines several levels deep
// all show up, not just the first level under the slide's own heading.
function renderBulletsHtml(nodes){
  if (!nodes || !nodes.length) return '';
  return `<ul>${nodes.map(n => `<li>${escapeHtml(n.title)}${renderBulletsHtml(n.children)}</li>`).join('')}</ul>`;
}

function renderPresentSlide(){
  const s = presentSlides[presentIndex];
  const myToken = ++presentRenderToken;
  const totalBullets = (s.bullets || []).length;
  const counter = `${presentIndex + 1} / ${presentSlides.length}` + (totalBullets ? ` · ${Math.min(presentRevealCount, totalBullets)}/${totalBullets}` : '');
  document.getElementById('present-counter').textContent = counter;
  const paras = s.bodyLines.map(l => `<p>${escapeHtml(l)}</p>`).join('');
  const list = renderBulletsHtml((s.bullets || []).slice(0, presentRevealCount)); // only top-level bullets are revealed progressively
  const tables = (s.tables || []).map(renderTableHtml).join('');
  const heading = s.isTitle
    ? `<h1 class="present-title-heading">${escapeHtml(s.title) || '(untitled)'}</h1>`
    : `<h2>${escapeHtml(s.title) || '(untitled)'}</h2>`;
  document.getElementById('present-slide').innerHTML =
    `${heading}<div class="present-body${s.isTitle ? ' present-title-body' : ''}">${paras}${list}${tables}<div class="present-images" id="present-images"></div></div>`;

  (s.images || []).forEach(async imgPath => {
    try{
      const dataUrl = await ghGetImageDataUrl(imgPath);
      if (myToken !== presentRenderToken) return; // navigated to another slide before this loaded
      const img = document.createElement('img');
      img.className = 'present-img';
      img.src = dataUrl;
      const container = document.getElementById('present-images');
      if (container) container.appendChild(img);
    }catch(e){
      console.error('present image failed to load:', imgPath, e);
    }
  });
}

function presentNext(){
  const totalBullets = (presentSlides[presentIndex].bullets || []).length;
  if (presentRevealCount < totalBullets){
    presentRevealCount++;
    renderPresentSlide();
    return;
  }
  if (presentIndex < presentSlides.length - 1){
    presentIndex++;
    presentRevealCount = 0; // a freshly-entered slide starts with its bullets hidden
    renderPresentSlide();
  }
}

function presentPrev(){
  if (presentRevealCount > 0){
    presentRevealCount--;
    renderPresentSlide();
    return;
  }
  if (presentIndex > 0){
    presentIndex--;
    presentRevealCount = (presentSlides[presentIndex].bullets || []).length; // stepping back shows that slide fully built
    renderPresentSlide();
  }
}

document.addEventListener('keydown', e => {
  if (!document.getElementById('present-overlay').classList.contains('open')) return;
  if (e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); presentNext(); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); presentPrev(); }
  else if (e.key === 'Escape'){ closePresent(); }
});

function renderOutlineNodes(nodes, path){
  return nodes.map(n => {
    const key = path + '::' + n.level + '::' + n.title;
    const collapsed = outlineCollapsed.has(key);
    const hasChildren = n.children.length > 0;
    const caret = hasChildren
      ? `<button class="caret" onclick="event.stopPropagation();toggleOutlineNode('${key.replace(/'/g,"\\'")}','${path.replace(/'/g,"\\'")}')">${collapsed ? '▸' : '▾'}</button>`
      : `<span class="caret caret-empty"></span>`;
    const stateBadge = n.state ? `<span class="badge badge-${n.state}">${n.state}</span>` : '';
    const isOpen = n.state === 'TODO' || n.state === 'NEXT' || n.state === 'WAITING';
    const titleClass = isOpen ? 'outline-title todo-open' : 'outline-title';
    const dateLabel = (n.deadline ? `deadline ${n.deadline}` : (n.scheduled ? `scheduled ${n.scheduled}` : '')) + (n.repeat ? ` · ${repeatLabel(n.repeat)}` : '');
    const indent = (n.level - 1) * 18;
    const childrenHtml = hasChildren && !collapsed ? `<div class="outline-children">${renderOutlineNodes(n.children, path)}</div>` : '';
    const presentBtn = hasChildren
      ? `<button class="present-btn" title="Present from here" onclick="event.stopPropagation();startPresent('${path.replace(/'/g,"\\'")}', ${n.lineIndex})">▶</button>`
      : '';
    return `<div class="outline-node" style="margin-left:${indent}px;">
      <div class="outline-row" onclick="jumpToLine('${path.replace(/'/g,"\\'")}', ${n.lineIndex})">
        ${caret}
        ${stateBadge}
        <span class="${titleClass}">${escapeHtml(n.title) || '<span class=\"empty\" style=\"display:inline\">(untitled)</span>'}</span>
        ${dateLabel ? `<span class="outline-date">${dateLabel}</span>` : ''}
        ${presentBtn}
      </div>
      ${childrenHtml}
    </div>`;
  }).join('');
}

function toggleOutlineNode(key, path){
  if (outlineCollapsed.has(key)) outlineCollapsed.delete(key);
  else outlineCollapsed.add(key);
  store.set('outline_collapsed', Array.from(outlineCollapsed));
  renderEditorPane(path);
}

function jumpToLine(path, lineIndex){
  window._jumpToLine = lineIndex;
  editorView = 'raw';
  renderEditorPane(path);
}

/* ---------- org tables ---------- */
function isTableLine(text){
  return /^\s*\|/.test(text);
}

function isTableSepRow(text){
  const t = text.trim();
  return t.length > 0 && /^\|[\-+:|\s]*\|?$/.test(t) && t.indexOf('-') !== -1;
}

function parseTableRow(text){
  const inner = text.trim().replace(/^\|/, '').replace(/\|$/, '');
  return inner.split('|').map(c => c.trim());
}

function findTableBlock(cm, line){
  let start = line, end = line;
  while (start > 0 && isTableLine(cm.getLine(start - 1))) start--;
  while (end < cm.lastLine() && isTableLine(cm.getLine(end + 1))) end++;
  return {start, end};
}

// Recomputes column widths across the whole table block and rewrites every
// row (including separator rows) so the pipes line up. Triggered by Tab
// while the cursor is on a table line — never runs outside that, so it
// can't affect typing performance elsewhere.
function alignTable(cm){
  const pos = cm.getCursor();
  const {start, end} = findTableBlock(cm, pos.line);
  const rawRows = [];
  for (let i = start; i <= end; i++) rawRows.push(cm.getLine(i));
  const parsed = rawRows.map(r => isTableSepRow(r) ? null : parseTableRow(r));
  const colCount = Math.max(1, ...parsed.filter(Boolean).map(r => r.length));
  const widths = new Array(colCount).fill(3);
  parsed.forEach(r => { if (r) r.forEach((c, i) => { widths[i] = Math.max(widths[i], c.length); }); });
  const newRows = rawRows.map((r, idx) => {
    if (isTableSepRow(r)) return '|' + widths.map(w => '-'.repeat(w + 2)).join('+') + '|';
    const cells = parsed[idx] || [];
    return '|' + widths.map((w, i) => ' ' + (cells[i] || '').padEnd(w) + ' ').join('|') + '|';
  });
  cm.operation(() => {
    for (let i = start; i <= end; i++){
      const newLine = newRows[i - start];
      if (cm.getLine(i) !== newLine){
        cm.replaceRange(newLine, {line: i, ch: 0}, {line: i, ch: cm.getLine(i).length});
      }
    }
  });
}

function insertTableTemplate(){
  if (!cmInstance) return;
  const pos = cmInstance.getCursor();
  const lineLen = cmInstance.getLine(pos.line).length;
  const template = '\n| Column 1 | Column 2 | Column 3 |\n|----------+----------+----------|\n|          |          |          |\n';
  cmInstance.replaceRange(template, {line: pos.line, ch: lineLen});
  cmInstance.focus();
}

// Sums each numeric column in the table the cursor is in, writing (or
// updating, if one already exists) a "Total" row at the bottom. This is a
// one-shot calculation, not a live formula — press the button again after
// editing numbers to refresh it.
function computeTableTotals(cm, pos){
  if (!isTableLine(cm.getLine(pos.line))) return false;
  const {start, end} = findTableBlock(cm, pos.line);
  const rows = [];
  for (let i = start; i <= end; i++) rows.push(cm.getLine(i));

  const sepRelIdx = rows.findIndex(isTableSepRow);
  const dataStartRel = sepRelIdx === -1 ? 0 : sepRelIdx + 1;

  const lastRel = rows.length - 1;
  let hasTotalRow = false;
  if (!isTableSepRow(rows[lastRel])){
    const cells = parseTableRow(rows[lastRel]);
    if (cells[0] && /^(total|sum)s?$/i.test(cells[0].trim())) hasTotalRow = true;
  }
  const dataEndRel = hasTotalRow ? lastRel - 1 : lastRel;

  const colSums = [];
  let colCount = 0;
  for (let i = dataStartRel; i <= dataEndRel; i++){
    const r = rows[i];
    if (isTableSepRow(r)) continue;
    const cells = parseTableRow(r);
    colCount = Math.max(colCount, cells.length);
    cells.forEach((c, ci) => {
      const num = parseFloat(String(c).replace(/,/g, ''));
      if (!isNaN(num)) colSums[ci] = (colSums[ci] || 0) + num;
    });
  }
  if (colCount === 0) return false;

  const fmt = n => n === undefined ? '' : (Number.isInteger(n) ? String(n) : n.toFixed(2));
  const totalCells = new Array(colCount).fill('');
  totalCells[0] = 'Total';
  for (let ci = 1; ci < colCount; ci++) totalCells[ci] = fmt(colSums[ci]);
  const totalLine = '| ' + totalCells.join(' | ') + ' |';

  cm.operation(() => {
    if (hasTotalRow){
      const lineNo = start + lastRel;
      cm.replaceRange(totalLine, {line: lineNo, ch: 0}, {line: lineNo, ch: cm.getLine(lineNo).length});
    } else {
      cm.replaceRange('\n' + totalLine, {line: end, ch: cm.getLine(end).length});
    }
  });
  return true;
}

function sumTable(){
  if (!cmInstance) return;
  const pos = cmInstance.getCursor();
  if (!computeTableTotals(cmInstance, pos)){
    setStatus('err', 'place cursor inside a table with numbers first');
    return;
  }
  alignTable(cmInstance);
  cmInstance.focus();
}

/* ---------- editor keyboard shortcuts (operate on the CodeMirror instance) ---------- */
function toggleTodoAtCursor(cm){
  const pos = cm.getCursor();
  const line = cm.getLine(pos.line);
  const m = line.match(/^(\*+\s+)(TODO|DONE)?\s?(.*)$/);
  let newLine;
  if (!m){
    newLine = '*** TODO ' + line;
  } else {
    const stars = m[1], kw = m[2], rest = m[3];
    const next = !kw ? 'TODO ' : (kw === 'TODO' ? 'DONE ' : '');
    newLine = stars + next + rest;
  }
  cm.replaceRange(newLine, {line: pos.line, ch: 0}, {line: pos.line, ch: line.length});
}

function insertScheduledAtCursor(cm, date){
  const pos = cm.getCursor();
  const lineLen = cm.getLine(pos.line).length;
  const d = date || new Date();
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const iso = localDateStr(d); // local date, not UTC — see todayStr() note above
  const insertion = `\nSCHEDULED: <${iso} ${days[d.getDay()]}>`;
  cm.replaceRange(insertion, {line: pos.line, ch: lineLen});
}

function insertEventAtCursor(cm, date, time){
  const pos = cm.getCursor();
  const line = cm.getLine(pos.line);
  if (!/^\*+\s/.test(line)){
    // Not a headline yet — turn this line into one first, level 3 by default.
    cm.replaceRange('*** ' + line, {line: pos.line, ch: 0}, {line: pos.line, ch: line.length});
  }
  const lineLen = cm.getLine(pos.line).length; // re-read: line may have just changed above
  const d = date || new Date();
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const iso = localDateStr(d);
  const insertion = `\n<${iso} ${days[d.getDay()]}${time ? ' ' + time : ''}>`;
  cm.replaceRange(insertion, {line: pos.line, ch: lineLen});
}

// Downscales/recompresses an image client-side before upload, since
// GitHub's Contents API has roughly a 1MB ceiling per file and phone
// photos routinely blow past that untouched.
function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim){
          if (w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Could not read that image'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('Could not read that file'));
    reader.readAsDataURL(file);
  });
}

async function uploadImage(file){
  setStatus('busy', 'uploading image…');
  const dataUrl = await resizeImageFile(file, 1600, 0.82);
  const base64 = dataUrl.split(',')[1];
  const stem = file.name.replace(/\.[^.]+$/, '').replace(/[^a-zA-Z0-9\-_]/g, '_') || 'image';
  const imgPath = `images/${stem}-${Date.now()}.jpg`;
  const res = await fetch(`${apiBase()}/contents/${imgPath}`, {
    method: 'PUT',
    headers: {...ghHeaders(), 'Content-Type': 'application/json'},
    body: JSON.stringify({message: `Add image ${imgPath}`, content: base64, branch: settings.branch})
  });
  if (!res.ok){
    const err = await res.json().catch(() => ({}));
    throw new Error(`GitHub error ${res.status}: ${err.message || res.statusText}`);
  }
  setStatus('ok', 'image uploaded');
  return {path: imgPath, dataUrl};
}

function openImagePicker(){
  if (!cmInstance) return;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.addEventListener('change', async () => {
    const file = input.files[0];
    document.body.removeChild(input);
    if (!file) return;
    try{
      const {path: imgPath, dataUrl} = await uploadImage(file);
      const pos = cmInstance.getCursor();
      const lineLen = cmInstance.getLine(pos.line).length;
      cmInstance.replaceRange(`\n[[${imgPath}]]`, {line: pos.line, ch: lineLen});
      const preview = document.createElement('img');
      preview.src = dataUrl;
      preview.style.maxWidth = '220px';
      preview.style.maxHeight = '220px';
      preview.style.borderRadius = '8px';
      preview.style.display = 'block';
      preview.style.margin = '4px 0 8px 0';
      cmInstance.addLineWidget(pos.line + 1, preview);
      cmInstance.focus();
    }catch(e){
      setStatus('err', e.message);
    }
  });
  input.click();
}

function openDatePicker(){
  if (!cmInstance) return;
  const input = document.createElement('input');
  input.type = 'date';
  input.style.position = 'fixed';
  input.style.opacity = '0';
  input.style.pointerEvents = 'none';
  input.style.left = '50%';
  input.style.top = '0';
  document.body.appendChild(input);
  const cleanup = () => { if (input.parentNode) document.body.removeChild(input); };
  input.addEventListener('change', () => {
    if (input.value){
      const [y, m, d] = input.value.split('-').map(Number);
      insertScheduledAtCursor(cmInstance, new Date(y, m - 1, d));
      cmInstance.focus();
    }
    cleanup();
  });
  input.addEventListener('blur', () => setTimeout(cleanup, 200));
  if (input.showPicker) input.showPicker();
  else input.click();
}

// Uses a sheet with visible date/time fields rather than chaining two
// native pickers: mobile browsers block a showPicker() call that isn't
// triggered by a direct user gesture, so opening the time picker from
// inside the date picker's change handler silently did nothing on phones.
function openEventTimePicker(){
  if (!cmInstance) return;
  const today = new Date();
  document.getElementById('eventadd-date').value = localDateStr(today);
  document.getElementById('eventadd-time').value = '';
  document.getElementById('eventadd-overlay').classList.add('open');
}

function closeEventAdd(){
  document.getElementById('eventadd-overlay').classList.remove('open');
}

function submitEventAdd(){
  const dateStr = document.getElementById('eventadd-date').value;
  const timeStr = document.getElementById('eventadd-time').value || null;
  closeEventAdd();
  if (!dateStr || !cmInstance) return;
  const [y, m, d] = dateStr.split('-').map(Number);
  insertEventAtCursor(cmInstance, new Date(y, m - 1, d), timeStr);
  cmInstance.focus();
}

// If the date digits in a SCHEDULED/DEADLINE timestamp are edited by hand,
// keep the weekday abbreviation next to them in sync automatically. This
// edits only the mismatched 3-letter span in place (via replaceRange)
// rather than replacing the whole document, so it never disturbs fold
// markers elsewhere in the file.
function fixTimestampWeekdaysInEditor(cm){
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const lineCount = cm.lineCount();
  for (let i = 0; i < lineCount; i++){
    const line = cm.getLine(i);
    const re = /<(\d{4})-(\d{2})-(\d{2}) (\w{3})/g;
    let m;
    while ((m = re.exec(line)) !== null){
      const [full, y, mo, d, dow] = m;
      const dt = new Date(Number(y), Number(mo) - 1, Number(d));
      if (isNaN(dt.getTime())) continue;
      const correct = days[dt.getDay()];
      if (correct !== dow){
        const dowStart = m.index + full.length - dow.length;
        cm.replaceRange(correct, CodeMirror.Pos(i, dowStart), CodeMirror.Pos(i, dowStart + dow.length));
      }
    }
  }
}

const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const SHORTCUT_HINT = IS_MAC
  ? '⌃⌥T toggle todo · ⌃⌥E event · 📅 pick date for scheduled · tap ▸ to fold'
  : 'ctrl+alt+t toggle todo · ctrl+alt+e event · 📅 pick date for scheduled · tap ▸ to fold';

let saveInFlight = false;
async function saveFile(path){
  // Guards against a double-tap firing two overlapping saves — the second
  // would otherwise race the first and get rejected by GitHub as a
  // conflict, since its cached sha is stale by the time it lands.
  if (saveInFlight) return;
  saveInFlight = true;
  const content = cmInstance ? cmInstance.getValue() : (fileCache[path] ? fileCache[path].content : '');
  const cached = fileCache[path];
  setStatus('busy', 'saving…');
  try{
    const res = await ghPutFile(path, content, cached ? cached.sha : null, `Edit ${path}`);
    fileCache[path] = {content, sha: res.content.sha};
    setStatus('ok', 'saved');
  }catch(e){
    setStatus('err', e.message);
  }finally{
    saveInFlight = false;
  }
}

function saveSettings(){
  settings = {
    token: document.getElementById('s-token').value.trim(),
    owner: document.getElementById('s-owner').value.trim(),
    repo: document.getElementById('s-repo').value.trim(),
    branch: document.getElementById('s-branch').value.trim() || 'main',
    notesPath: document.getElementById('s-path').value.trim().replace(/\/+$/,'') || 'notes',
    captureFile: document.getElementById('s-capture').value.trim().replace(/^\/+/,'') || 'inbox.org',
    eventsFile: document.getElementById('s-events').value.trim().replace(/^\/+/,'') || 'events.org'
  };
  store.set('gh_settings', settings);
  switchTab('agenda');
  refreshAgenda();
}

/* ---------- quick add ---------- */
function capturePath(){
  return settings.notesPath + '/' + (settings.captureFile || 'inbox.org');
}
function eventsPath(){
  return settings.notesPath + '/' + (settings.eventsFile || 'events.org');
}

let quickAddType = 'task';

function setQuickAddType(type){
  quickAddType = type;
  document.getElementById('quickadd-type-task').className = type === 'task' ? 'primary' : 'ghost';
  document.getElementById('quickadd-type-event').className = type === 'event' ? 'primary' : 'ghost';
  document.getElementById('quickadd-label').textContent = type === 'task' ? 'New Task' : 'New Event';
  document.getElementById('quickadd-date-label').textContent = type === 'task' ? 'Date (optional)' : 'Date';
  document.getElementById('quickadd-input').placeholder = type === 'task' ? 'What needs doing?' : 'What\'s the event?';
  const select = document.getElementById('quickadd-file');
  const defaultPath = type === 'event' ? eventsPath() : capturePath();
  if (select && [...select.options].some(o => o.value === defaultPath)){
    select.value = defaultPath;
  }
}

async function openQuickAdd(){
  if (!settings.token || !settings.owner || !settings.repo){
    setStatus('err', 'connect a repo first (Settings)');
    switchTab('settings');
    return;
  }
  const overlay = document.getElementById('quickadd-overlay');
  overlay.classList.add('open');
  const input = document.getElementById('quickadd-input');
  input.value = '';
  document.getElementById('quickadd-date').value = '';
  document.getElementById('quickadd-time').value = '';
  setTimeout(() => input.focus(), 50);

  const select = document.getElementById('quickadd-file');
  select.innerHTML = '<option>loading files…</option>';
  try{
    const files = await listOrgFiles(settings.notesPath);
    const relLabel = f => f.startsWith(settings.notesPath + '/') ? f.slice(settings.notesPath.length + 1) : f;
    const defaults = [capturePath(), eventsPath()];
    // Make sure the configured quick-add/events files are offered even if
    // they don't exist on GitHub yet (they'll be created on first use).
    const allPaths = [...new Set([...defaults, ...files])];
    select.innerHTML = allPaths.map(f => `<option value="${f}">${escapeHtml(relLabel(f))}</option>`).join('');
  }catch(e){
    select.innerHTML = `<option value="${capturePath()}">${escapeHtml(settings.captureFile || 'inbox.org')}</option>`;
  }
  setQuickAddType('task');
}

function closeQuickAdd(){
  document.getElementById('quickadd-overlay').classList.remove('open');
}

let quickAddInFlight = false;
async function submitQuickAdd(){
  if (quickAddInFlight) return;
  const input = document.getElementById('quickadd-input');
  const title = input.value.trim();
  if (!title) return;
  const dateStr = document.getElementById('quickadd-date').value || null;
  const timeStr = document.getElementById('quickadd-time').value || null;
  const targetPath = document.getElementById('quickadd-file').value || (quickAddType === 'event' ? eventsPath() : capturePath());
  if (quickAddType === 'event' && !dateStr){
    setStatus('err', 'events need a date');
    return; // leave the sheet open so a date can be added
  }
  closeQuickAdd();
  quickAddInFlight = true;
  try{
    if (quickAddType === 'event'){
      await appendLineToFile(targetPath, `*** ${title}\n` + timestampLine(null, dateStr, timeStr, false), `Quick add event: ${title}`);
    } else {
      await appendLineToFile(targetPath, `*** TODO ${title}\n` + (dateStr ? timestampLine('SCHEDULED', dateStr, timeStr, true) : ''), `Quick add: ${title}`);
    }
  }finally{
    quickAddInFlight = false;
  }
}

document.getElementById('quickadd-input').addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); submitQuickAdd(); }
});

// Builds a single timestamp line: either a plain event timestamp
// ("<date Day time>") or a labeled one ("SCHEDULED: <date Day time>").
function timestampLine(label, dateStr, timeStr, labeled){
  const [y, m, d] = dateStr.split('-').map(Number);
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const dow = days[new Date(y, m - 1, d).getDay()];
  const ts = `<${dateStr} ${dow}${timeStr ? ' ' + timeStr : ''}>`;
  return (labeled ? `${label}: ${ts}` : ts) + '\n';
}

async function appendLineToFile(path, line, commitMessage){
  setStatus('busy', 'adding…');
  try{
    let existing = null;
    try{ existing = await ghGetFile(path); }
    catch(e){ existing = null; } // file doesn't exist yet — quick-add will create it
    const newContent = existing
      ? (existing.content.endsWith('\n') || existing.content === '' ? existing.content + line : existing.content + '\n' + line)
      : line;
    const res = await ghPutFile(path, newContent, existing ? existing.sha : null, commitMessage);
    fileCache[path] = {content: newContent, sha: res.content.sha};
    setStatus('ok', 'added');
    if (currentTab === 'agenda') refreshAgenda();
  }catch(e){
    setStatus('err', e.message);
  }
}

/* ---------- tabs / status ---------- */
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if (tab === 'agenda'){ document.getElementById('ml-buffer').textContent = '*agenda*'; renderAgenda(); }
  else if (tab === 'files'){ document.getElementById('ml-buffer').textContent = '*files*'; renderFiles(); }
  else if (tab === 'settings'){ renderSettings(); }
}
document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('button[data-tab]');
  if (btn) switchTab(btn.dataset.tab);
});

function setStatus(kind, msg){
  const el = document.getElementById('ml-status');
  el.className = 'status ' + kind;
  el.textContent = msg;
}

/* ---------- boot ---------- */
initAgendaDragHandlers();
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
  // As soon as a newly-deployed service worker takes over, reload once so
  // this tab is guaranteed to be running the current version — no more
  // needing to manually close/reopen the app or clear site data by hand.
  let swRefreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (swRefreshing) return;
    swRefreshing = true;
    window.location.reload();
  });
}
if (settings.token && settings.owner && settings.repo){
  refreshAgenda();
} else {
  setStatus('err', 'not configured');
  renderAgenda();
}
if (new URLSearchParams(window.location.search).get('action') === 'quickadd'){
  setTimeout(openQuickAdd, 100);
  history.replaceState(null, '', window.location.pathname); // drop the query param so a later refresh doesn't reopen it
}
